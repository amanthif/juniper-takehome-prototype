<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Non-Scale Victories · Prototype</title>
<meta name="description" content="Working prototype: a home screen that shows credible progress beyond the scale, next to what's normal for each stage of GLP-1 treatment. Illustrative data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design rules: one thing leads each screen · one accent (lilac), amber only for a stall · dots for data ·
   three text sizes (22 serif, 15 body, 13 quiet) · plain words · the source is always one tap away. */
:root{
  --page:#F1ECF2; --bg:#FAF5FB; --card:#FFFFFF; --ink:#1F2A24; --quiet:#5B655F; --line:#ECE5EE;
  --green:#1E3B2C; --lilac:#EFE6F8; --lilac-ink:#7E52B8; --berry:#CFC3F5; --amber:#FFF3D6; --amber-ink:#7A4E00; --amber-dot:#C98A1B;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac-ink);outline-offset:2px;border-radius:8px}
p{margin:0}

/* layout */
.layout{display:grid;grid-template-columns:300px auto;gap:56px;justify-content:center;align-items:start;padding:40px 24px}
.stage{position:sticky;top:24px}
.phone{width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;background:#141816;border-radius:52px;padding:12px}
.app{position:relative;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;display:flex;flex-direction:column}

/* controls: toggles only */
.demo{font-size:13.5px}
.demo h1{font-family:var(--serif);font-weight:400;color:var(--green);font-size:24px;margin:0 0 18px}
.demo summary{display:none}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet);margin-bottom:6px;padding:0}
.seg-row{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg-row.wrap{flex-wrap:wrap}
.seg-row label{flex:1;position:relative;min-width:0}
.seg-row input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-row span,.seg-row button{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;border-radius:9px;font-weight:500;text-align:center;padding:0 6px;cursor:pointer;border:0;background:none;font-size:13px}
.seg-row>button{flex:1}
.seg-row.wrap>button{flex:1 1 30%}
.seg-row input:checked+span,.seg-row button[aria-pressed="true"],.seg-row button[aria-current="step"]{background:var(--green);color:#fff}
.seg-row input:focus-visible+span{outline:3px solid var(--lilac-ink);outline-offset:1px}
.seg-row label.off span{opacity:.35;cursor:not-allowed}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tgb{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left}
.tgb::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid #B9B1BD;flex:none}
.tgb[aria-checked="true"]::before{background:var(--green);border-color:var(--green)}
.reset{background:none;border:0;color:var(--quiet);cursor:pointer;min-height:44px;padding:0;text-decoration:underline;text-underline-offset:3px}
.foot{color:var(--quiet);font-size:12px}

/* phone: shared */
.screen{flex:1;overflow-y:auto;padding:44px 18px 24px}
.hello{font-family:var(--serif);font-weight:400;color:var(--green);font-size:22px;line-height:1.2;margin:0 0 14px}
.quiet{color:var(--quiet);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kv+.kv{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.kv span:last-child{color:var(--quiet);font-size:13px;text-align:right}
.tap{display:block;width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer}
.card.tap{background:var(--card);padding:16px}
.tabbar{flex:none;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 20px}
.tab{flex:1;border:0;background:none;font-size:12px;color:var(--quiet);min-height:48px;cursor:pointer}
.tab[aria-current="page"]{color:var(--green);font-weight:600}

/* hero: the one thing that leads */
.hero{background:var(--lilac);border-radius:22px;padding:20px 18px 12px}
.hero.stall{background:var(--amber);padding-bottom:18px}
.hero .k{font-size:13px;font-weight:500;color:var(--lilac-ink)}
.hero.stall .k{color:var(--amber-ink)}
.hero .big{font-family:var(--serif);color:var(--green);font-size:22px;line-height:1.2;margin:6px 0 8px}
.hero .sub{color:#3E4A44}
.hero.new{animation:fade .5s ease-out}
@keyframes fade{from{opacity:.3}to{opacity:1}}
.hplot{background:var(--card);border-radius:14px;padding:4px 12px 10px;margin-top:12px}
.herofoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.dots{display:flex;align-items:center;margin-left:-10px;min-height:44px}
.dots button{width:28px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.dots i{width:6px;height:6px;border-radius:50%;background:#B9B1BD;transition:width .2s}
.dots [aria-current="true"] i{width:18px;border-radius:3px;background:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:12px;border:0;font-weight:600;cursor:pointer;padding:0 16px;background:var(--green);color:#fff;margin-top:16px}
.btn.soft{background:var(--lilac);color:var(--green)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--lilac-ink);font-weight:500;cursor:pointer;min-height:44px;padding:0}

/* berries: a dot shows where she is */
.range{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:12px;display:block}
.range s{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--berry)}
.range u{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--green);border:3px solid var(--card)}
.range.stall u{background:var(--amber-dot)}
.steps{display:flex;margin-top:14px}
.steps li{flex:1;list-style:none;text-align:center;font-size:13px;color:var(--quiet);position:relative;padding-top:20px}
.steps li::before{content:"";position:absolute;top:0;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;border:2px solid #B9B1BD;background:var(--card)}
.steps li.done::before{background:var(--berry);border-color:var(--berry)}
.steps li.here::before{background:var(--green);border-color:var(--green)}
.steps li.here{color:var(--green);font-weight:500}
.plot{display:flex;gap:6px;height:56px;margin-top:10px}
.plot span{flex:1;position:relative}
.plot i{position:absolute;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:var(--berry)}
.plot span:last-child i{background:var(--green)}

/* lists */
.win{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 0;min-height:52px;cursor:pointer;border-top:1px solid var(--line)}
.win:first-child{border-top:0;padding-top:0}
.win:last-child{padding-bottom:0}
.win::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.win.noted::before{background:#B9B1BD}
.win.noted{color:var(--quiet)}
.h2{font-family:var(--serif);font-weight:400;color:var(--green);font-size:22px;margin:26px 0 0}

/* question */
.q{font-weight:500;margin-bottom:12px}
.slider{width:100%;min-height:44px;accent-color:var(--green)}
.ends{display:flex;justify-content:space-between;margin-top:-4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:99px;min-height:44px;padding:0 14px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.mic{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:0;background:var(--green);color:#fff;cursor:pointer;margin:14px auto 6px}
.or{display:flex;align-items:center;gap:12px;color:var(--quiet);font-size:13px;margin:12px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.lrow{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.glasses{display:flex;gap:4px;margin:8px -4px 0}
.glasses button{flex:1;height:44px;border:0;background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.glasses i{width:22px;height:26px;border-radius:4px 4px 9px 9px;border:2px solid var(--berry);background:none}
.glasses [aria-pressed="true"] i{background:var(--berry)}
.opt.sm{min-height:40px;font-size:13px;padding:0 12px}
.said{font-family:var(--serif);font-size:22px;color:var(--green);line-height:1.25}

/* lock screen */
.lock{position:absolute;inset:0;background:#2F2845;color:#fff;display:flex;flex-direction:column;align-items:center;padding:76px 16px}
.lock .time{font-size:80px;font-weight:300;letter-spacing:-2px;line-height:1.1;margin-bottom:32px}
.notif{width:100%;background:rgba(255,255,255,.9);color:var(--ink);border-radius:20px;padding:14px 16px;text-align:left;border:0;cursor:pointer;min-height:64px;animation:fade .5s ease-out}
.notif .who{display:flex;align-items:center;gap:8px;color:var(--quiet);font-size:13px;margin-bottom:6px}
.notif .who i{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.notif .who span{margin-left:auto}
.notif b{display:block;font-weight:600;font-size:16px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(20,24,22,.35);z-index:5;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:22px 20px 28px;max-height:86%;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .big{font-family:var(--serif);color:var(--green);font-size:22px;line-height:1.2;margin:0 44px 12px 0}
.sheet p+p{margin-top:12px}
.x{position:absolute;right:-6px;top:-8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:20px}
.sheet-in{position:relative}
.checks{list-style:none;padding:0;margin:14px 0 0}
.checks li{display:flex;gap:10px;align-items:baseline;margin:8px 0}
.checks li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;transform:translateY(-1px)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1F2A24;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.notif,.hero.new{animation:none}.dots i{transition:none}}

@media (max-width:860px){
  .layout{display:block;padding:0}
  .demo{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .demo summary{display:flex;align-items:center;min-height:44px;font-weight:600;cursor:pointer}
  .demo h1{font-size:20px;margin:8px 0 14px}
  .stage{position:static}
  .phone{width:100%;height:auto;min-height:0;background:none;border-radius:0;padding:0}
  .app{border-radius:0;height:auto;min-height:100vh;overflow:visible}
  .screen{overflow:visible;padding-top:24px}
  .lock{position:relative;min-height:100vh}
  .tabbar{position:sticky;bottom:0;z-index:4}
  .scrim{position:fixed}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="demo" aria-label="Prototype controls">
    <details id="demoDetails" open>
      <summary>Controls</summary>
      <h1>Non-Scale Victories</h1>
      <fieldset><legend>Case</legend><div class="seg-row wrap" id="presets"></div></fieldset>
      <fieldset><legend>Stage of treatment</legend><div class="seg-row" data-k="stage"></div></fieldset>
      <fieldset><legend>Scale this week</legend><div class="seg-row" data-k="scale"></div></fieldset>
      <fieldset><legend>Total weight lost so far</legend><div class="seg-row" data-k="range"></div></fieldset>
      <fieldset><legend>What she already logs</legend><div class="tg" id="have"></div></fieldset>
      <fieldset><legend>Since her last visit</legend><div class="seg-row" data-k="stale"></div></fieldset>
      <fieldset><legend>Step</legend><div class="seg-row" id="steps"></div></fieldset>
      <button class="reset" data-act="reset">Reset</button>
      <p class="foot">Sarah is fictional. All data and ranges are illustrative.</p>
    </details>
  </aside>
  <div class="stage"><div class="phone"><div class="app" id="app"></div></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== Sample data (illustrative) ===================== */
// Expected % of body weight lost by week of treatment: [week, low, high]. To be replaced with Juniper's own data.
const RANGE = [[0, 0, 0], [4, 0.5, 2.5], [6, 1, 4], [12, 3, 7], [14, 3.8, 7.8], [20, 6, 10], [22, 7, 11], [30, 9, 14], [40, 11, 17], [58, 12, 20], [80, 12, 20]];
function range(w){
  for (let i = 1; i < RANGE.length; i++){
    const [w1, l1, h1] = RANGE[i], [w0, l0, h0] = RANGE[i - 1];
    if (w <= w1){ const f = (w - w0) / (w1 - w0); return { lo: l0 + (l1 - l0) * f, hi: h0 + (h1 - h0) * f }; }
  }
  return { lo: 12, hi: 20 };
}
const mid = w => { const r = range(w); return (r.lo + r.hi) / 2; };
const START_KG = 92, DOSES = ['2.5', '5', '7.5', '10'];
const STAGES = {
  w6:  { lbl: 'Week 6',  week: 6,  dose: '5 mg',   doseIdx: 1, phase: 'inc',    lost: { in: 2.1, below: 0.6 },  waist: { in: 2, below: 1 },   next: 'Your next dose step is in 4 weeks. Nausea can return for a few days, then it passes.' },
  w12: { lbl: 'Week 12', week: 12, dose: '7.5 mg', doseIdx: 2, phase: 'inc',    lost: { in: 4.2, below: 1.8 },  waist: { in: 3, below: 1 },   next: 'Your dose review is next week. If you step up, nausea can return for a few days.' },
  w22: { lbl: 'Week 22', week: 22, dose: '10 mg',  doseIdx: 3, phase: 'steady', lost: { in: 9.4, below: 2.6 },  waist: { in: 7, below: 2 },   next: 'Your next weigh-in is Monday.' },
  w58: { lbl: 'Week 58', week: 58, dose: '10 mg',  doseIdx: 3, phase: 'steady', lost: { in: 14.0, below: 6.5 }, waist: { in: 11, below: 4 },  next: 'Your next weigh-in is Monday.' },
};
const CONTROLS = {
  stage: Object.entries(STAGES).map(([k, v]) => [k, v.lbl]),
  scale: [['down', 'Down'], ['flat', 'Flat']],
  range: [['in', 'As expected'], ['below', 'Less than expected']],
  stale: [['new', 'Something new'], ['same', 'Nothing new']],
};
// Data the current app already collects. Switch off to see fewer wins: nothing is invented.
const LOGS = [['appetite', 'Appetite'], ['side', 'Side effects'], ['waist', 'Waist'], ['habits', 'Protein']];
// The quick dump: when we know little, she can tell June about her week in one breath, or tap what's true. Each answer becomes a win straight away.
const DUMP = [['appetite', 'Less hungry'], ['sideNone', 'No side effects'], ['sideSome', 'Some side effects'], ['clothes', 'Clothes looser'], ['energy', 'More energy']];
const HEARD = ['appetite', 'sideNone', 'clothes'];
const PRESETS = [
  ['Start', { stage: 'w6', scale: 'flat', range: 'in', have: ['side'] }],
  ['Slow week', { stage: 'w6', scale: 'flat', range: 'in', have: ['appetite', 'side'] }],
  ['Good week', { stage: 'w22', scale: 'down', range: 'in', have: ['waist', 'habits'] }],
  ['Plateau', { stage: 'w58', scale: 'flat', range: 'in', have: ['waist', 'habits'] }],
  ['Stall', { stage: 'w22', scale: 'flat', range: 'below', have: ['side'] }],
];
// Which wins lead in each phase. A down week always leads with weight.
const PRIORITY = { inc: ['weight', 'appetite', 'side', 'clothes', 'energy', 'course', 'habits', 'waist'], steady: ['weight', 'waist', 'clothes', 'habits', 'energy', 'appetite', 'course', 'side'], plateau: ['kept', 'waist', 'clothes', 'habits', 'energy', 'course', 'appetite', 'side'] };
const TREND = { appetite: [2, 3, 3, 4, 4, 5, 5, 5], sideInc: [2, 3, 3, 2, 4, 3, 2, 1], sideSteady: [3, 2, 2, 1, 1, 0, 1, 0], protein: [2, 3, 3, 4, 4, 5, 4, 5] };

/* ===================== State ===================== */
const initial = () => ({ tab: 'today', stage: 'w6', scale: 'flat', range: 'in', stale: 'new', have: { appetite: true, side: true, waist: false, habits: false },
  ans: {}, just: [], slide: 0, pick: [], water: 3, meals: [], newWin: null, say: null, sayChips: [], kg: false, step: 'trigger', sheet: null, sent: false });
const STEPS = [['trigger', 'Trigger'], ['home', 'Today'], ['detail', 'Detail'], ['checkin', 'Question'], ['outcome', 'Outcome']];
let state = initial();
const fmt = n => n.toFixed(1).replace(/\.0$/, '');

/* ===================== Model: everything on screen is worked out from the state ===================== */
function model(){
  const st = STAGES[state.stage], below = state.range === 'below', flat = state.scale === 'flat', lost = st.lost[state.range];
  const r = range(st.week), lo = Math.round(r.lo), hi = Math.round(r.hi), steady = st.phase === 'steady';
  // Plateau = flat AFTER reaching the expected range. Stall = flat while still BELOW it, on a steady dose.
  const stall = below && flat && steady, plateau = !below && flat && st.week >= 58;
  const flatWeeks = stall ? 6 : plateau ? 8 : flat ? 1 : 0, phase = plateau ? 'plateau' : st.phase, wk = Math.min(8, st.week);
  const pts = []; for (let w = 0; w <= st.week; w++) pts.push(+(lost * mid(Math.min(w, st.week - flatWeeks)) / mid(st.week - flatWeeks)).toFixed(2));
  const all = [], now = k => state.ans[k] !== undefined;

  all.push(st.phase === 'inc'
    ? { id: 'course', title: `You’ve stepped up to ${st.dose}.`, sub: 'Right on schedule. Each step brings you closer to your full dose.', more: `You haven’t missed a dose in ${st.week} weeks.`, from: 'your treatment tracker' }
    : { id: 'course', title: `You haven’t missed a dose in ${st.week} weeks.`, sub: `You’ve settled into ${st.dose}.`, from: 'your treatment tracker' });

  const al = state.ans.appetite;
  if (state.have.appetite) all.push({ id: 'appetite', title: 'Your appetite has settled.', sub: 'This is often the first change. The scale tends to follow.', more: 'Balanced or lower on 5 of the last 7 days.', from: 'your appetite logs', plot: TREND.appetite.slice(-wk), plotL: 'Days at balanced or lower, each week' });
  else if (now('appetite')) all.push(al <= 3
    ? { id: 'appetite', title: `Your appetite is ${al === 3 ? 'balanced' : 'lower'} today.`, sub: 'This is often the first change. The scale tends to follow.', from: 'your answer today' }
    : { id: 'appetite', noted: true, title: 'Your appetite is high today.', sub: `That’s common at ${st.dose}. It often settles after the next dose step.`, from: 'your answer today' });

  const sl = state.ans.side, sidePlot = (st.phase === 'inc' ? TREND.sideInc : TREND.sideSteady).slice(-wk);
  if (state.have.side) all.push(st.phase === 'inc'
    ? { id: 'side', title: 'Your nausea is easing.', sub: 'One day this week. Your body is getting used to the medicine.', more: 'It can return for a few days after a dose step, then it passes.', from: 'your side-effect logs', plot: sidePlot, plotL: 'Days with nausea, each week' }
    : { id: 'side', title: 'Your side effects have settled.', sub: 'None this week.', from: 'your side-effect logs', plot: sidePlot, plotL: 'Days with side effects, each week' });
  else if (now('side')) all.push(sl.length === 0
    ? { id: 'side', title: 'No side effects this week.', sub: 'Your body is getting used to this dose.', from: 'your answer today' }
    : { id: 'side', noted: true, title: `${sl.join(', ')} this week.`, sub: 'This is common on a new dose and usually eases. Your care team can see it.', from: 'your answer today' });

  if (state.ans.clothes) all.push({ id: 'clothes', title: 'Your clothes feel looser.', sub: 'Your body often changes before the scale shows it.', from: 'your answer today' });
  if (state.ans.energy) all.push({ id: 'energy', title: 'You have more energy.', sub: 'A change you can feel, whatever the scale says.', from: 'your answer today' });
  // Today's logs count too: reaching a goal becomes a win the moment she taps it.
  if (state.water >= GLASSES) all.push({ id: 'water', title: 'You reached your water goal today.', sub: 'It helps with side effects like headaches and constipation.', from: 'your log today' });
  if (proteinToday() >= PROTEIN_GOAL) all.push({ id: 'protein', title: 'You reached your protein goal today.', sub: 'Protein helps you keep muscle while you lose weight.', from: 'your log today' });
  if (state.have.habits) all.push({ id: 'habits', title: 'You reached your protein goal on 5 days.', sub: 'Protein helps you keep muscle while you lose weight.', from: 'your daily goals', plot: TREND.protein.slice(-wk), plotL: 'Days on your protein goal, each week' });
  if (state.have.waist) all.push({ id: 'waist', title: `Your waist is down ${st.waist[state.range]} cm.`, sub: 'Waist often changes before the scale does.', from: 'your waist measurements' });

  if (!below && !flat) all.push({ id: 'weight', title: `You’ve lost ${fmt(lost)}% of your body weight.`, sub: 'Steady progress, week on week.', from: 'your weigh-ins' });
  // Down this week but still under the range: a real win, never the lead.

    case 'weight': state.tab = 'progress'; render(); into('wsec'); track('weight_opened'); break;
    case 'kg': state.kg = !state.kg; render(); $('[data-act="kg"]').focus({ preventScroll: true }); break;
    case 'pick': { const v = el.dataset.v, on = state.pick.includes(v); state.pick = state.pick.filter(c => c !== v && !(v.startsWith('side') && c.startsWith('side'))).concat(on ? [] : [v]); render(); const b = document.querySelector(`[data-act="pick"][data-v="${v}"]`); b && b.focus({ preventScroll: true }); break; }
    case 'water': { const i = +el.dataset.i, had = hasWin('water'); state.water = state.water === i ? i - 1 : i; const won = goalWin('water', had); render(); if (won) toast('Water goal reached. Added to your wins'); const b = document.querySelector(`[data-act="water"][data-i="${i}"]`); b && b.focus({ preventScroll: true }); break; }
    case 'meal': { const v = el.dataset.v, had = hasWin('protein'); state.meals = state.meals.includes(v) ? state.meals.filter(m => m !== v) : state.meals.concat(v); const won = goalWin('protein', had); render(); if (won) toast('Protein goal reached. Added to your wins'); const b = document.querySelector(`[data-act="meal"][data-v="${v}"]`); b && b.focus({ preventScroll: true }); break; }
    case 'meal-say': { const m = MEALS.find(x => !state.meals.includes(x[0])); if (!m){ toast('Every meal is logged today'); break; } const had = hasWin('protein'); state.meals = state.meals.concat(m[0]); const won = goalWin('protein', had); render(); toast(won ? 'Protein goal reached. Added to your wins' : `June logged ${m[1].toLowerCase()}: about ${m[2]}g protein`); break; }
    case 'dump-save': applyDump(state.pick.slice()); break;
    case 'say': state.say = 'listening'; state.sayChips = model().ask.filter(k => HEARD.includes(k)); render(); setTimeout(() => { if (state.say === 'listening'){ state.say = 'confirm'; render(); const b = $('[data-act="say-ok"]'); b && b.focus({ preventScroll: true }); } }, 1500); break;
    case 'say-x': state.sayChips = state.sayChips.filter(k => k !== el.dataset.k); render(); break;
    case 'say-ok': applyDump(state.sayChips.slice()); break;
    case 'care': opener = '[data-act="care"]'; state.sheet = { type: 'care' }; state.step = 'outcome'; render(); $('.x').focus(); track('care_team_tapped'); break;
    case 'send': state.sent = true; render(); $('.x').focus(); break;
    case 'close': case 'scrim': closeSheet(); break;
    case 'todo': toast('Not part of this prototype'); break;
    case 'reset': state = initial(); render(); break;
  }
});
if (matchMedia('(max-width:860px)').matches) $('#demoDetails').open = false;
render();
</script>
