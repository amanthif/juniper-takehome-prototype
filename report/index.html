<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monthly Progress Report · Prototype</title>
<meta name="description" content="Working prototype: a monthly progress report that answers the question a user has at each stage of GLP-1 treatment, and pays back every answer. Illustrative data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Design rules: one thing leads each screen · one accent (lilac), amber only for a stall · dots for data ·
   three text sizes (22 serif, 15 body, 13 quiet) · plain words · the source is always one tap away. */
:root{
  --page:#F1ECF2; --bg:#FAF5FB; --card:#FFFFFF; --ink:#1F2A24; --quiet:#5B655F; --line:#ECE5EE;
  --green:#1E3B2C; --lilac:#EFE6F8; --lilac-ink:#7E52B8; --berry:#CFC3F5; --amber:#FFF3D6; --amber-ink:#7A4E00; --amber-dot:#C98A1B;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac-ink);outline-offset:2px;border-radius:8px}
p{margin:0}

/* layout */
.layout{display:grid;grid-template-columns:300px auto;gap:56px;justify-content:center;align-items:start;padding:40px 24px}
.stage{position:sticky;top:24px}
.phone{width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;background:#141816;border-radius:52px;padding:12px}
.app{position:relative;height:100%;background:var(--bg);border-radius:40px;overflow:hidden;display:flex;flex-direction:column}

/* controls: toggles only */
.demo{font-size:13.5px}
.demo h1{font-family:var(--serif);font-weight:400;color:var(--green);font-size:24px;margin:0 0 18px}
.demo summary{display:none}
fieldset{border:0;padding:0;margin:0 0 14px}
legend{font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--quiet);margin-bottom:6px;padding:0}
.seg-row{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg-row.wrap{flex-wrap:wrap}
.seg-row label{flex:1;position:relative;min-width:0}
.seg-row input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-row span,.seg-row button{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;border-radius:9px;font-weight:500;text-align:center;padding:0 6px;cursor:pointer;border:0;background:none;font-size:13px}
.seg-row>button{flex:1}
.seg-row.wrap>button{flex:1 1 30%}
.seg-row input:checked+span,.seg-row button[aria-pressed="true"],.seg-row button[aria-current="step"]{background:var(--green);color:#fff}
.seg-row input:focus-visible+span{outline:3px solid var(--lilac-ink);outline-offset:1px}
.seg-row label.off span{opacity:.35;cursor:not-allowed}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tgb{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 10px;text-align:left}
.tgb::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid #B9B1BD;flex:none}
.tgb[aria-checked="true"]::before{background:var(--green);border-color:var(--green)}
.reset{background:none;border:0;color:var(--quiet);cursor:pointer;min-height:44px;padding:0;text-decoration:underline;text-underline-offset:3px}
.foot{color:var(--quiet);font-size:12px}

/* phone: shared */
.screen{flex:1;overflow-y:auto;padding:44px 18px 24px}
.hello{font-family:var(--serif);font-weight:400;color:var(--green);font-size:22px;line-height:1.2;margin:0 0 14px}
.quiet{color:var(--quiet);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-top:10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kv+.kv{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.kv span:last-child{color:var(--quiet);font-size:13px;text-align:right}
.tap{display:block;width:100%;text-align:left;border:0;background:none;padding:0;cursor:pointer}
.card.tap{background:var(--card);padding:16px}
.tabbar{flex:none;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 20px}
.tab{flex:1;border:0;background:none;font-size:12px;color:var(--quiet);min-height:48px;cursor:pointer}
.tab[aria-current="page"]{color:var(--green);font-weight:600}

/* hero: the one thing that leads */
.hero{background:var(--lilac);border-radius:22px;padding:20px 18px 12px}
.hero.stall{background:var(--amber);padding-bottom:18px}
.hero .k{font-size:13px;font-weight:500;color:var(--lilac-ink)}
.hero.stall .k{color:var(--amber-ink)}
.hero .big{font-family:var(--serif);color:var(--green);font-size:22px;line-height:1.2;margin:6px 0 8px}
.hero .sub{color:#3E4A44}
.hero.new{animation:fade .5s ease-out}
@keyframes fade{from{opacity:.3}to{opacity:1}}
.herofoot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.dots{display:flex;align-items:center;margin-left:-10px;min-height:44px}
.dots button{width:28px;height:44px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0}
.dots i{width:6px;height:6px;border-radius:50%;background:#B9B1BD;transition:width .2s}
.dots [aria-current="true"] i{width:18px;border-radius:3px;background:var(--green)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:12px;border:0;font-weight:600;cursor:pointer;padding:0 16px;background:var(--green);color:#fff;margin-top:16px}
.btn.soft{background:var(--lilac);color:var(--green)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--lilac-ink);font-weight:500;cursor:pointer;min-height:44px;padding:0}

/* berries: a dot shows where she is */
.range{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:12px;display:block}
.range s{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--berry)}
.range u{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--green);border:3px solid var(--card)}
.range.stall u{background:var(--amber-dot)}
.steps{display:flex;margin-top:14px}
.steps li{flex:1;list-style:none;text-align:center;font-size:13px;color:var(--quiet);position:relative;padding-top:20px}
.steps li::before{content:"";position:absolute;top:0;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;border:2px solid #B9B1BD;background:var(--card)}
.steps li.done::before{background:var(--berry);border-color:var(--berry)}
.steps li.here::before{background:var(--green);border-color:var(--green)}
.steps li.here{color:var(--green);font-weight:500}
.plot{display:flex;gap:6px;height:56px;margin-top:10px}
.plot span{flex:1;position:relative}
.plot i{position:absolute;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:var(--berry)}
.plot span:last-child i{background:var(--green)}

/* lists */
.win{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 0;min-height:52px;cursor:pointer;border-top:1px solid var(--line)}
.win:first-child{border-top:0;padding-top:0}
.win:last-child{padding-bottom:0}
.win::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.win.noted::before{background:#B9B1BD}
.win.noted{color:var(--quiet)}
.h2{font-family:var(--serif);font-weight:400;color:var(--green);font-size:22px;margin:26px 0 0}

/* question */
.q{font-weight:500;margin-bottom:12px}
.slider{width:100%;min-height:44px;accent-color:var(--green)}
.ends{display:flex;justify-content:space-between;margin-top:-4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:99px;min-height:44px;padding:0 14px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.said{font-family:var(--serif);font-size:22px;color:var(--green);line-height:1.25}

/* lock screen */
.lock{position:absolute;inset:0;background:#2F2845;color:#fff;display:flex;flex-direction:column;align-items:center;padding:76px 16px}
.lock .time{font-size:80px;font-weight:300;letter-spacing:-2px;line-height:1.1;margin-bottom:32px}
.notif{width:100%;background:rgba(255,255,255,.9);color:var(--ink);border-radius:20px;padding:14px 16px;text-align:left;border:0;cursor:pointer;min-height:64px;animation:fade .5s ease-out}
.notif .who{display:flex;align-items:center;gap:8px;color:var(--quiet);font-size:13px;margin-bottom:6px}
.notif .who i{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600}
.notif .who span{margin-left:auto}
.notif b{display:block;font-weight:600;font-size:16px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(20,24,22,.35);z-index:5;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:22px 20px 28px;max-height:86%;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .big{font-family:var(--serif);color:var(--green);font-size:22px;line-height:1.2;margin:0 44px 12px 0}
.sheet p+p{margin-top:12px}
.x{position:absolute;right:-6px;top:-8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;font-size:20px}
.sheet-in{position:relative}
.checks{list-style:none;padding:0;margin:14px 0 0}
.checks li{display:flex;gap:10px;align-items:baseline;margin:8px 0}
.checks li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;transform:translateY(-1px)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1F2A24;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.notif,.hero.new{animation:none}.dots i{transition:none}}

@media (max-width:860px){
  .layout{display:block;padding:0}
  .demo{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .demo summary{display:flex;align-items:center;min-height:44px;font-weight:600;cursor:pointer}
  .demo h1{font-size:20px;margin:8px 0 14px}
  .stage{position:static}
  .phone{width:100%;height:auto;min-height:0;background:none;border-radius:0;padding:0}
  .app{border-radius:0;height:auto;min-height:100vh;overflow:visible}
  .screen{overflow:visible;padding-top:24px}
  .lock{position:relative;min-height:100vh}
  .tabbar{position:sticky;bottom:0;z-index:4}
  .scrim{position:fixed}
}

/* report additions */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.kv small{display:block;font-size:13px;color:var(--quiet);font-weight:400}
.kv>span:first-child{min-width:0}
.kv>span:last-child{color:var(--ink);font-size:15px;text-align:right;white-space:nowrap;flex:none}
.kv.new>span:last-child{color:var(--lilac-ink);font-weight:500}
.kv.warn>span:last-child{color:var(--amber-ink);font-weight:500}
.rows>*+*{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.rows .kv+.kv{border-top:1px solid var(--line)}
.goal{background:var(--lilac)}
.goal .k{font-size:13px;font-weight:500;color:var(--lilac-ink)}
.goal .big{font-family:var(--serif);color:var(--green);font-size:22px;line-height:1.2;margin:6px 0 6px}
.goal .range{background:#fff}
.goal .range u{border-color:var(--lilac)}
.wt{display:flex;gap:8px;align-items:center}
.wt input{width:120px;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:inherit}
.wcheck{background:var(--amber);color:var(--amber-ink);border-radius:14px;padding:12px 14px;margin-top:12px}
.quote{font-family:var(--serif);font-size:18px;color:var(--green);line-height:1.3;margin-top:12px}
.quote small{display:block;font-family:var(--sans);font-size:13px;color:var(--quiet)}
.mic{display:grid;place-items:center;width:84px;height:84px;margin:20px auto 8px;border:0;border-radius:50%;background:var(--green);color:#fff;cursor:pointer;transition:transform .15s,background .15s}
.mic.on{transform:scale(1.12);background:var(--lilac-ink)}
.junesays{background:var(--lilac);border-radius:16px;padding:12px 14px;margin-top:14px}
.helpopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;margin-top:10px;cursor:pointer;min-height:44px}
.helpopt.rec{border-color:var(--green)}
.helpopt small{display:block;font-size:13px;color:var(--quiet)}
.helpopt .tag{display:inline-block;margin-left:8px;color:var(--lilac-ink);font-weight:500}
.flag{background:var(--amber);color:var(--amber-ink);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:13px}
.seg-row>button{min-height:40px}
.seg-row.wrap label{flex:1 1 45%}

/* the report as a story: one idea per page */
.story{display:flex;flex-direction:column;height:100%;background:var(--bg)}
.story.lilac{background:var(--lilac)}
.story.amber{background:var(--amber)}
.segs{display:flex;gap:5px;padding:22px 64px 0 20px}
.segs i{flex:1;height:4px;border-radius:2px;background:rgba(30,59,44,.15)}
.segs i.on{background:var(--green)}
.close{position:absolute;right:10px;top:4px;width:44px;height:44px;border:0;background:none;font-size:24px;color:var(--green);cursor:pointer;z-index:2}
.pg{flex:1;overflow-y:auto;padding:36px 22px 20px}
.pg .k{font-size:13px;font-weight:500;color:var(--lilac-ink);margin-bottom:8px}
.story.amber .pg .k{color:var(--amber-ink)}
.lead{font-family:var(--serif);font-weight:400;color:var(--green);font-size:30px;line-height:1.15;margin:0 0 14px}
.lead.sm{font-size:22px;line-height:1.25}
.lede{color:#3E4A44;margin-bottom:6px}
.nav{flex:none;display:flex;gap:10px;padding:12px 20px 24px}
.nav .btn{margin:0}
.nav .btn.soft{flex:0 0 96px;background:rgba(255,255,255,.7)}
.opts.col{flex-direction:column;margin-top:8px}
.opts.col .opt{border-radius:14px;min-height:52px;text-align:left;padding:0 16px;background:var(--card)}
.cmp{display:grid;grid-template-columns:1fr 78px 86px;gap:8px;align-items:baseline}
.cmp>span:nth-child(2){color:var(--quiet);font-size:13px;text-align:right}
.cmp>span:nth-child(3){text-align:right;font-weight:500}
.cmp small{display:block;font-size:13px;color:var(--quiet);font-weight:400}
.cmp.head>span{font-size:13px;color:var(--quiet);font-weight:400}
.cmp.new>span:nth-child(3){color:var(--lilac-ink)}
.cmp.warn>span:nth-child(3){color:var(--amber-ink)}
.note{background:var(--card);border-radius:22px;padding:22px 20px;font-family:var(--serif);font-size:18px;line-height:1.45;color:var(--green)}
.note p+p{margin-top:12px}
.note .sig{display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:15px;color:var(--ink);margin-top:18px}
.note .sig i{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:600;flex:none}
.note .sig small{display:block;font-size:13px;color:var(--quiet)}
.nav .btn:not(.soft){flex:1 1 0;width:auto}
.nav.has-skip{flex-wrap:wrap;padding-bottom:8px}
.nav .link{flex:1 0 100%;color:var(--green);text-align:center}
/* story cards: one big number, one visual */
#lead{font-weight:400;margin:0}
.hero-num{display:block;font-family:var(--serif);font-size:72px;line-height:1;letter-spacing:-1.5px;color:var(--green);margin:10px 0 6px}
.hero-num.sm{font-size:48px;margin:4px 0 8px}
.hero-num small{font-family:var(--sans);font-size:15px;letter-spacing:0;color:var(--quiet);margin-left:8px}
.hero-cap{display:block;font-family:var(--serif);font-size:22px;line-height:1.25;color:var(--green)}
.viz{background:rgba(255,255,255,.72);border-radius:18px;padding:16px;margin-top:22px}
.viz svg{display:block;width:100%}
.viz .range{margin-top:6px}
.berries{display:flex;gap:6px;flex-wrap:wrap}
.berries i{width:18px;height:18px;border-radius:50%;background:var(--berry)}
.berries i.on{background:var(--green)}
.pair{display:grid;grid-template-columns:84px 1fr;align-items:center;gap:8px}
.pair+.pair{margin-top:12px}
.pair .berries{flex-wrap:nowrap;gap:5px}
.pair .berries i{width:14px;height:14px;flex:none}
.prow+.prow{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.prow svg{display:block;width:100%;margin-top:4px}
.pg .quote{margin-top:20px;padding:0 4px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
.tile{display:flex;flex-direction:column;gap:2px;min-height:84px;min-width:0;padding:9px 12px;border:0;border-radius:16px;background:var(--card);text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.tile .top{width:100%;display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:500}
.tile .top>span{white-space:nowrap}
.tile .top .quiet{font-weight:400}
.tile .new{color:var(--lilac-ink)}
.tile .num{margin:0}
.num small{font-family:var(--sans);font-size:13px;color:var(--quiet);margin-left:4px}
.tile svg{display:block;width:100%;margin-top:auto}
.tile .berries{margin-top:auto}
.tile .berries i{width:14px;height:14px}
.tile.warn .num::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber-dot);margin-right:6px;transform:translateY(-3px)}
.tile.empty{background:none;border:1.5px dashed #D9CFE0;color:var(--quiet);justify-content:center;font-size:13px}
.tile.empty .add{color:var(--lilac-ink);font-weight:500;font-size:15px}
.grp{font-size:13px;font-weight:500;color:var(--quiet);margin:12px 6px 0}
.grp+.tiles{margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.db{display:grid;grid-template-columns:84px 1fr 84px;gap:10px;align-items:center;min-height:32px;font-size:13px}
.db>span:last-child{text-align:right;white-space:nowrap}
.track{position:relative;height:16px}
.track::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;border-radius:1px;background:var(--line)}
.track b{position:absolute;top:6px;height:4px;border-radius:2px;background:var(--berry)}
.track i,.legend i{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;box-sizing:border-box}
.track i.a,.legend i.a{background:#fff;border:2px solid #B5A6E8}
.track i.b,.legend i.b{background:var(--green);border:2px solid #fff}
.legend{display:flex;align-items:center;gap:6px;margin-top:8px}
.legend i{position:static;margin:0 0 0 8px}
.legend i:first-child{margin-left:0}
.tl{list-style:none;padding:0;margin:20px 0 0}
.tl li{position:relative;padding:0 0 22px 28px}
.tl li .quiet{display:block}
.tl li::before{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--berry)}
.tl li:first-child::before{background:var(--green)}
.tl li::after{content:"";position:absolute;left:5px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li:last-child{padding-bottom:6px}
.tip b{font-weight:600}
.wcard .lbl+.db{margin-top:8px}
.chip{flex:none;font-size:13px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--lilac);color:var(--lilac-ink)}
.chip.amber{background:var(--amber);color:var(--amber-ink)}
.goalrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wcard .lbl{display:block}
.wcard .num{display:block;margin:0}
.wcard .link{min-height:32px}
.sumfact{font-size:13px;color:#3E4A44;margin-top:4px}
.sumline{font-family:var(--serif);font-size:18px;line-height:1.3;color:var(--green)}
.sum+.card{margin-top:8px}
.full .card{margin-top:8px}
.full .note{margin-top:8px;padding:16px;font-size:16px}
/* the full report: everything from the story on one page */
.pg.full{padding:20px 16px 28px}
.full .top{padding:0 6px;margin-right:44px}
.full .top .k{margin-bottom:2px}
.full .top .lead{font-size:22px;line-height:1.25;margin-bottom:10px}
.full .sum{padding:12px 14px}
.full .sum .btn{min-height:42px;margin-top:8px}
.full .sum+.sec{margin-top:16px}
.sum{background:var(--lilac);border-radius:18px;padding:18px}
.sum.amber{background:var(--amber)}
.sum.amber .k{color:var(--amber-ink)}
.sum .lead{margin-bottom:8px}
.sum .btn{margin-top:14px}
.sec{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--quiet);margin:24px 6px 0}
.sec+.note{margin-top:10px}
.why{font-family:var(--serif);font-size:18px;line-height:1.35;color:var(--green)}
.metric{display:flex;align-items:center;gap:14px}
.metric>div{flex:1;min-width:0}
.metric svg{flex:none;width:124px;height:48px}
.metric .lbl,.wcard .lbl{font-size:13px;font-weight:500;color:var(--ink)}
.num{font-family:var(--serif);font-size:22px;line-height:1.2;color:var(--green);margin:2px 0}
.metric.warn .num::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber-dot);margin-right:8px;transform:translateY(-3px)}
.ask{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ask .link{flex:none}
@media (max-width:860px){.story{min-height:100vh}.nav{position:sticky;bottom:0;background:inherit}}
</style>

<body>
<div class="layout">
  <aside class="demo" aria-label="Prototype controls">
    <details id="demoDetails" open>
      <summary>Controls</summary>
      <h1>Monthly Progress Report</h1>
      <fieldset><legend>Data we have</legend><div class="seg-row" data-k="data"></div></fieldset>
      <fieldset><legend>Stage</legend><div class="seg-row" data-k="stage"></div></fieldset>
      <fieldset><legend>Progress</legend><div class="seg-row" data-k="progress"></div></fieldset>
      <fieldset><legend>Page</legend><div class="seg-row" id="pages"></div></fieldset>
      <fieldset><legend>Her goal weight (on track, month 3)</legend><div class="seg-row" data-k="goal"></div></fieldset>
      <fieldset><legend>Time</legend><div class="seg-row"><button data-act="nextmonth">Next month →</button></div></fieldset>
      <button class="reset" data-act="reset">Reset</button>
      <p class="foot">Sarah is fictional. All data and ranges are illustrative.</p>
    </details>
  </aside>
  <div class="stage"><div class="phone"><div class="app" id="app"></div></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== Sample data (illustrative) ===================== */
const START_KG = 92, DOSES = [2.5, 5, 7.5, 10];
const MONTHS = ['October', 'November', 'December', 'January', 'February'], NEXT_ORDER = ['20 Nov', '20 Dec', '20 Jan', '20 Feb', '20 Mar'];
// pct = % of body weight lost so far. "below" is used for both "behind, feels fine" and "stalled".
// "slow" is the user doing everything right (doses on time, stepped up on schedule, appetite down) whose weight is still under the expected range.
const STAGES = {
  early:   { n: 1, week: 3,  on: { pct: 1.9, doseIdx: 0, rate: 1.7 },  below: { pct: 0.4, doseIdx: 0, rate: 0.4 } },
  middle:  { n: 3, week: 10, on: { pct: 7.4, doseIdx: 2, rate: 2.1 },  below: { pct: 2.8, doseIdx: 0, rate: 0.6, stuck: true }, slow: { pct: 3.1, doseIdx: 2, rate: 0.7 } },
  plateau: { n: 6, week: 26, on: { pct: 13.1, doseIdx: 3, rate: 0.3 }, below: { pct: 5.2, doseIdx: 1, rate: 0, stuck: true }, slow: { pct: 6.0, doseIdx: 3, rate: 0.5 } },
};
// Expected % lost by week (illustrative curve).
const band = w => { const k = 1 - Math.exp(-w / 22); return { lo: 10 * k, hi: 22 * k }; };
const CONTROLS = {
  data: [['rich', 'Rich'], ['light', 'Light'], ['none', 'None']],
  stage: [['early', 'Month 1'], ['middle', 'Month 3'], ['plateau', 'Month 6']],
  progress: [['on', 'On track'], ['slow', 'On track, slow scale'], ['risk', 'Behind, feels fine'], ['below', 'Stalled']],
  goal: [['far', 'Far off'], ['close', 'Close']],
};
const QS = [
  ['appetite', 'How’s your appetite compared with before you started?', [['much', 'Much smaller'], ['bit', 'A bit smaller'], ['same', 'About the same']]],
  ['side', 'Any side effects this month?', [['none', 'None'], ['some', 'Some, manageable'], ['most', 'Most days']]],
  ['energy', 'How’s your energy compared with before you started?', [['better', 'Better'], ['same', 'The same'], ['worse', 'Worse']]],
];
const HELP = {
  prescriber: { who: 'Dr Lee', title: 'Your prescriber', desc: 'Reviews your dose and side effects.', sent: 'Dr Lee has your report and usually replies within a day.' },
  coach: { who: 'Priya', title: 'Your coach', desc: 'Ten minutes to make treatment fit your week.', sent: 'Priya has your report and usually replies the same day.' },
  support: { who: 'the support team', title: 'The support team', desc: 'Your plan and payment options, including pausing.', sent: 'The support team has your answers and will be in touch.' },
};

/* ===================== State ===================== */
const initial = () => ({ data: 'rich', stage: 'middle', progress: 'on', goal: 'far', opened: false, full: false, page: 0, monthIdx: 0, q: {}, qi: 0, qDone: false, wPrompt: false, wOk: false, worth: null, chart: false, help: null, helpSent: null, tile: null });
let state = initial();
const fmt = n => n.toFixed(1).replace(/\.0$/, '');

/* ===================== Model ===================== */
function sc(){
  // Slow scale needs weigh-ins to be known, and in month 1 a small loss is simply early, so those cases fall back.
  const slow = state.progress === 'slow' && state.stage !== 'early' && state.data !== 'none';
  const st = STAGES[state.stage], below = !slow && state.progress !== 'on' && !(state.progress === 'slow' && state.data === 'none'), p = st[slow ? 'slow' : below ? 'below' : 'on'], q = state.q;
  const stall = state.progress === 'below' && state.stage !== 'early';
  // Hidden risk: behind where we'd expect, but she feels fine. An early warning, not an alarm.
  const risk = state.progress === 'risk' && state.stage !== 'early' && state.data !== 'none';
  // Concern also comes from what she tells us, not only the scale.
  const wPct = state.qDone && q.weight ? (START_KG - q.weight) / START_KG * 100 : null, flags = [];
  if (state.qDone){ if (wPct !== null && wPct < -1) flags.push('gain'); if (q.side === 'most') flags.push('side'); if (q.appetite === 'same' && state.stage !== 'early') flags.push('appetite'); }
  // Goal weight: shown only to on-track users in active loss; emphasised when close and on pace. "Far off" is 15%, "Close" is 10%.
  let goal = null;
  if (!below && !slow && state.data !== 'none'){
    const total = START_KG * (state.goal === 'close' ? 0.10 : 0.15), done = START_KG * p.pct / 100, left = +(total - done).toFixed(1);
    if (left <= 0) goal = state.stage === 'plateau' ? { reached: true } : null;
    else if (state.stage === 'middle') goal = { total, left, pc: Math.round(done / total * 100), close: left <= 3, weeks: Math.max(1, Math.round(left / (p.rate / 4.3))) };
  }
  return { ...st, ...p, below, slow, stall, risk, flags, wPct, goal, data: state.data, stage: state.stage, dose: DOSES[p.doseIdx], stuck: !!p.stuck, band: band(st.week), month: MONTHS[state.monthIdx % MONTHS.length], concern: stall || risk || slow || flags.length > 0 };
}
// A weight this far from her starting weight is more often a typo than real, so confirm it first.
const wImplausible = w => w && ((w - START_KG) / START_KG > .03 || (START_KG - w) / START_KG > .2);
/* What we'd measure (no real analytics): report_opened · question_answered · chart_opened · worth_it_answered · help_requested */

/* ===================== Helpers ===================== */
const $ = x => document.querySelector(x);
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function rangeBar(lost, b, amber){
  const max = Math.max(b.hi * 1.35, lost * 1.1, 1), p = v => Math.max(0, Math.min(100, v / max * 100)).toFixed(1);
  return `<div class="range ${amber ? 'stall' : ''}" role="img" aria-label="${fmt(lost)}% lost. We’d expect ${fmt(b.lo)} to ${fmt(b.hi)}%."><s style="left:${p(b.lo)}%;width:${p(b.hi - b.lo)}%"></s><u style="left:${p(lost)}%"></u></div>`;
}
const helpBtn = label => state.helpSent ? `<p style="margin-top:16px;font-weight:500">${HELP[state.helpSent].sent}</p>` : `<button class="btn" data-act="help">${label}</button>`;

/* The report is a story: six pages, one idea each. */
/* The report is a short story (one visual and one line per card) that lands on a one-screen dashboard. Every card can skip straight to it. */
// Rich-data users are not asked anything: we already have it. Everyone else gets a few questions as the last card.
const asks = () => state.data !== 'rich';
const since = s => s.stage === 'early' || s.data === 'none' ? 'at the start' : 'last month';

/* ===================== Small charts ===================== */
// Four weekly points from then to now. Bars for counts of days, a step for dose, a line for the rest.
const ser = (a, b, type) => [0, .4, .75, 1].map((t, i) => type === 'step' ? (i < 2 ? a : b) : type === 'bars' ? Math.round(a + (b - a) * t) : a + (b - a) * (t + (a !== b ? [0, .1, -.08, 0][i] : 0)));
function mini(v, type, warn, W = 150, H = 30, label = ''){
  const col = warn ? 'var(--amber-dot)' : 'var(--green)', n = v.length, open = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  if (type === 'bars'){ const max = Math.max(...v, 1), gap = W * .06, bw = (W - gap * (n - 1)) / n;
    return open + v.map((x, i) => { const h = Math.max(3, x / max * (H - 2)); return `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${col}" opacity="${i === n - 1 ? 1 : .3}"><title>Week ${i + 1}: ${fmt(x)}</title></rect>`; }).join('') + '</svg>'; }
  const lo = Math.min(...v), hi = Math.max(...v), r = 5, X = i => r + 2 + i * (W - 2 * r - 4) / (n - 1), Y = x => hi === lo ? H / 2 : r + 2 + (H - 2 * r - 4) * (1 - (x - lo) / (hi - lo));
  const d = v.map((x, i) => i === 0 ? `M${X(0).toFixed(1)},${Y(x).toFixed(1)}` : type === 'step' ? `H${X(i).toFixed(1)}V${Y(x).toFixed(1)}` : `L${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join('');
  return open + `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".45"/><circle cx="${X(n - 1).toFixed(1)}" cy="${Y(v[n - 1]).toFixed(1)}" r="${r}" fill="${col}" stroke="#fff" stroke-width="2"><title>Now: ${fmt(v[n - 1])}</title></circle></svg>`;
}
const berries = (n, total, warn) => `<span class="berries ${warn ? 'warn' : ''}" role="img" aria-label="${n} of ${total}">${Array.from({ length: total }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
function chart(s, cap = true, H = 130){
  const W = 320, pl = 28, pr = 10, pt = 8, pb = 20, xs = s.week + 2, ymax = Math.ceil((band(xs).hi + 1) / 5) * 5;
  const has = s.data !== 'none', pct = has ? s.pct : s.wPct === null ? null : Math.max(0, s.wPct);
  const X = w => pl + (W - pl - pr) * w / xs, Y = v => pt + (H - pt - pb) * (1 - v / ymax), ease = w => (1 - Math.exp(-w / 22)) / (1 - Math.exp(-s.week / 22));
  let up = '', dn = ''; for (let w = 0; w <= xs; w++){ up += `${X(w).toFixed(1)},${Y(band(w).hi).toFixed(1)} `; dn = `${X(w).toFixed(1)},${Y(band(w).lo).toFixed(1)} ` + dn; }
  const step = s.data === 'rich' ? 1 : Math.max(1, Math.floor(s.week / 2)), pts = []; if (has){ for (let w = 0; w < s.week; w += step) pts.push([w, pct * ease(w)]); pts.push([s.week, pct]); }
  const col = 'var(--green)'; // no warning colour on her own data
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight against where we’d expect" style="width:100%;display:block;margin-top:8px">
    <polygon points="${up}${dn}" fill="var(--berry)" opacity=".6"/>${pts.length ? `<path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${pts.slice(0, -1).map(p => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="9" fill="transparent"><title>${p[0] ? `Week ${p[0]}` : 'Start'}: ${fmt(p[1])}% down</title></circle>`).join('')}
    ${pct !== null ? `<circle cx="${X(s.week)}" cy="${Y(pct).toFixed(1)}" r="6" fill="${col}" stroke="#fff" stroke-width="3"><title>Week ${s.week}: ${fmt(pct)}% down</title></circle>` : ''}
    <text x="${pl}" y="${H - 3}" font-size="11" fill="#5B655F">Start</text><text x="${X(s.week)}" y="${H - 3}" font-size="11" fill="#5B655F" text-anchor="middle">Week ${s.week}</text>
    <text x="${pl - 6}" y="${Y(ymax) + 4}" font-size="11" fill="#5B655F" text-anchor="end">${ymax}%</text><text x="${pl - 6}" y="${Y(0) + 4}" font-size="11" fill="#5B655F" text-anchor="end">0</text></svg>
    ${cap ? `<p class="quiet">${has ? 'The shaded band is where we’d expect you to be.' : `The shaded band is where people at month ${s.n} usually are.`}</p>` : ''}`;
}

/* ===================== Her numbers ===================== */
// Illustrative values by stage and case: [then, now].
const T = {
  early:   { on: { app: [8, 6], side: [4, 1], energy: [2, 3], waist: [100, 99], sleep: [6.4, 6.6], steps: [4.1, 4.4] }, below: { app: [8, 7], side: [4, 3], energy: [2, 2], waist: [100, 100], sleep: [6.4, 6.3], steps: [4.1, 4.0] } },
  middle:  { on: { app: [5, 3], side: [2, 0], energy: [3, 4], waist: [99, 96], sleep: [6.6, 7.1], steps: [5.2, 6.8], hba: [5.9, 5.7] }, slow: { app: [5, 3], side: [2, 0], energy: [3, 4], waist: [99, 98], sleep: [6.6, 6.9], steps: [5.2, 6.1], hba: [5.9, 5.8] }, below: { app: [6, 6], side: [3, 3], energy: [2, 2], waist: [99, 99], sleep: [6.5, 6.4], steps: [4.0, 3.9], hba: [5.9, 5.9] } },
  plateau: { on: { app: [3, 2], side: [0, 0], energy: [4, 4], waist: [94, 93], sleep: [7.2, 7.3], steps: [7.4, 7.6], hba: [5.9, 5.6] }, slow: { app: [3, 3], side: [0, 0], energy: [4, 4], waist: [97, 96], sleep: [7.0, 7.1], steps: [6.8, 7.0], hba: [5.9, 5.8] }, below: { app: [6, 6], side: [3, 3], energy: [2, 2], waist: [98, 98], sleep: [6.5, 6.4], steps: [4.0, 3.9], hba: [5.9, 5.9] } },
};
const vals = s => { const t = T[s.stage]; return t[s.slow ? 'slow' : s.below ? 'below' : 'on'] || t.on; };
function metrics(s){
  const v = vals(s), a = state.qDone, q = state.q, rich = s.data === 'rich', out = [];
  const M = (k, label, pair, unit, type, src, o = {}) => out.push({ k, label, then: pair[0], now: pair[1], unit, type, src, ...o });
  const E = (k, label) => out.push({ k, label, empty: true });
  const ans = { app: { much: 3, bit: 5, same: 8 }[q.appetite], side: { none: 0, some: 2, most: 5 }[q.side], energy: { better: 4, same: 2, worse: 1 }[q.energy] }, today = 'From your answer today';
  const app = () => a ? M('app', 'Food noise', [rich ? v.app[0] : null, ans.app], '/10', 'line', today, { isNew: true, warn: q.appetite === 'same' }) : rich ? M('app', 'Food noise', v.app, '/10', 'line', 'From your check-ins with June') : s.data === 'light' ? M('app', 'Food noise', [null, s.below ? 6 : 4], '/10', 'line', 'From what you told June') : E('app', 'Food noise');
  const side = () => a ? M('side', 'Nausea', [rich ? v.side[0] : null, ans.side], 'days a week', 'bars', today, { isNew: true, warn: q.side === 'most' }) : rich ? M('side', 'Nausea', v.side, 'days a week', 'bars', 'From your side-effect log') : s.data === 'light' ? M('side', 'Nausea', [null, s.below ? 3 : 1], 'days a week', 'bars', 'From what you told June') : E('side', 'Side effects');
  const energy = () => a ? M('energy', 'Energy', [rich ? v.energy[0] : null, ans.energy], '/5', 'line', today, { isNew: true, warn: q.energy === 'worse' }) : rich ? M('energy', 'Energy', v.energy, '/5', 'line', 'From your check-ins with June') : E('energy', 'Energy');
  const dose = () => M('dose', 'Dose', [s.stuck || s.stage === 'early' ? s.dose : DOSES[Math.max(0, s.doseIdx - 1)], s.dose], 'mg', 'step', 'From your prescription', s.stuck ? { note: 'A dose review is ready when you are' } : {});
  const ontime = () => out.push({ k: 'ontime', label: 'Doses on time', then: null, now: 4, unit: 'of 4', berries: [4, 4], src: 'From your orders' });
  app(); side(); energy();
  if (rich){ M('waist', 'Waist', v.waist, 'cm', 'line', 'From your measurements'); M('sleep', 'Sleep', v.sleep, 'h a night', 'line', 'From your wearable'); M('steps', 'Steps', v.steps, 'k a day', 'line', 'From your wearable'); dose(); v.hba ? M('hba', 'Blood sugar', v.hba, '% HbA1c', 'line', 'From your blood tests') : ontime(); }
  else { dose(); ontime(); E('waist', 'Waist'); E('sleep', 'Sleep'); E('steps', 'Steps'); }
  return ['app', 'side', 'energy', 'sleep', 'waist', 'steps', 'dose', 'hba', 'ontime'].map(k => out.find(m => m.k === k)).filter(Boolean);
}
function tile(m, s){
  if (m.empty) return `<button class="tile empty" data-act="add"><span>${m.label}</span><span class="add">+ Add</span></button>`;
  const viz = m.berries ? berries(...m.berries) : m.then === null ? '' : mini(ser(m.then, m.now, m.type), m.type, m.warn, 150, 30, `${m.label}: ${fmt(m.then)} to ${fmt(m.now)}`);
  return `<button class="tile ${m.warn ? 'warn' : ''}" data-act="tile" data-k="${m.k}"><span class="top"><span>${m.label}</span>${m.isNew ? '<span class="new">New</span>' : m.then !== null && m.then !== m.now ? `<span class="quiet" aria-label="was ${fmt(m.then)}">${m.now < m.then ? '↓' : '↑'} ${fmt(Math.abs(m.now - m.then))}</span>` : ''}</span><span class="num">${fmt(m.now)}<small>${m.unit}</small></span>${viz}</button>`;
}
// The source of every number is one tap away.
function tileSheet(s){
  const m = state.tile && metrics(s).find(x => x.k === state.tile); if (!m) return '';
  return `<div class="scrim" data-act="h-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-in"><button class="x" data-act="h-close" aria-label="Close">×</button>
    <p class="quiet" id="sh-t">${m.label}</p><p class="hero-num sm">${fmt(m.now)}<small>${m.unit}</small></p>
    ${m.then !== null ? `<p>${m.then === m.now ? `The same as ${since(s)}.` : `${fmt(m.then)} ${since(s)}.`}</p>${m.berries ? '' : mini(ser(m.then, m.now, m.type), m.type, m.warn, 300, 70, m.label)}` : m.berries ? berries(...m.berries) : '<p>Your first reading. Next month shows the trend.</p>'}
    ${m.note ? `<p class="flag">${m.note}.</p>` : ''}<p class="quiet" style="margin-top:12px">${m.src}. Weekly points are illustrative.</p></div></div></div>`;
}

/* ===================== Card 1. The headline ===================== */
function leadText(s){
  const a = state.qDone, pct = `${fmt(s.pct)}%`;
  if (s.data === 'none' && !a && !s.stall) return { big: `Month ${s.n}`, cap: 'on treatment', sub: `${s.n === 1 ? 'Your first order' : `${s.n} orders`} on time · ${s.dose}mg`, cta: s.stall ? 'Talk to my care team' : '' };
  // The check-in is an open door, not a verdict: if you need help, we are one tap away. The care team makes any clinical call with her.
  const door = 'If you’d like a hand with anything, your care team is one tap away.';
  const talk = 'Talk to my care team';
  if (s.stall) return { warm: 'You’re doing your part.', fact: `${s.data === 'none' ? 'Your doses are on time.' : `Every dose taken, and you’re ${pct} down so far.`} ${door}`, cta: talk, bar: s.data !== 'none' };
  if (s.flags.length){ const f = s.flags[0];
    return { cta: talk, ...(f === 'gain' ? { warm: 'We’re here if you need us.', fact: `Thanks for your weigh-in today. ${door}` } : f === 'side' ? { warm: 'You shouldn’t have to push through side effects.', fact: 'Your care team can ease them, and they’re one tap away.' } : { warm: 'We’re here if you need us.', fact: 'If you’d like to talk through your dose, your care team is one tap away.' }) }; }
  if (s.risk) return { warm: 'A consistent month.', fact: `You took every dose, and you’re ${pct} down so far. ${door}`, cta: talk, bar: true };
  if (s.slow) return { warm: 'You’re doing your part.', fact: `Every dose taken, and you’re ${pct} down so far. ${door}`, cta: talk, bar: true };
  if (s.data === 'none') return { big: 'It’s started', cap: 'your appetite has changed', sub: 'From your answers today.' };
  if (s.stage === 'early') return { big: 'Month 1', cap: 'done', sub: s.below ? 'Weight usually moves after your first step up.' : 'Every dose taken. Side effects easing.' };
  if (s.stage === 'middle') return { big: pct, cap: 'down since you started', sub: `Where we’d expect at month ${s.n}.`, bar: true };
  return { big: '8 weeks', cap: `holding at ${pct} down`, sub: 'Holding steady is the result now.', bar: true };
}
// Weight is not the automatic hero. With full data and nothing to flag, the story opens on the change she can feel.
const richOn = s => s.data === 'rich' && !s.concern && !s.below;
function cardLead(s){
  if (richOn(s)) return cardChange(s, `${s.month} · Month ${s.n}`);
  const t = leadText(s);
  if (t.warm) return `<p class="k">${s.month} · Month ${s.n}</p><h1 class="lead" id="lead" tabindex="-1">${t.warm}</h1><p class="lede">${t.fact}</p>${t.bar ? `<div class="viz">${rangeBar(s.pct, s.band, false)}</div>` : ''}${helpBtn(t.cta)}`;
  return `<p class="k">${s.month} · Month ${s.n}</p><h1 id="lead" tabindex="-1"><span class="hero-num">${t.big}</span><span class="hero-cap">${t.cap}</span></h1>
    ${t.bar ? `<div class="viz">${rangeBar(s.pct, s.band, false)}<p class="quiet" style="margin-top:12px">${t.sub}</p></div>` : `<p class="lede">${t.sub}</p>`}${t.cta ? helpBtn(t.cta) : ''}`;
}

/* ===================== Card 2. The biggest change ===================== */
function cardChange(s, kicker){
  const v = vals(s), big = (k, n, cap, viz) => `<p class="k">${kicker || k}</p><h1 id="lead" tabindex="-1"><span class="hero-num">${n}</span><span class="hero-cap">${cap}</span></h1><div class="viz">${viz}</div>`;
  const row = (l, x) => `<div class="pair"><span class="quiet">${l}</span>${x}</div>`;
  if (s.data === 'none') return big('What we know', '4 of 4', 'doses on time', berries(4, 4));
  if (s.data === 'light') return big('This month', '2', 'weigh-ins', berries(2, 4) + '<p class="quiet" style="margin-top:12px">Four would show your trend.</p>');
  if (s.below && s.stage !== 'early') return big('Your dose', `${s.dose}mg`, 'your current dose', mini(ser(s.dose, s.dose, 'step'), 'step', false, 300, 70, 'Dose') + '<p class="quiet">A dose review is ready when you are.</p>');
  // The opening is whichever number moved most this month, relative to its own scale. It is not always the same metric.
  if (richOn(s)){
    const scale = { app: [10, -1], side: [7, -1], energy: [5, 1], sleep: [3, 1], steps: [5, 1], waist: [15, -1], hba: [1.5, -1] };
    const top = Object.keys(scale).filter(k => v[k]).map(k => ({ k, a: v[k][0], b: v[k][1], score: (v[k][1] - v[k][0]) * scale[k][1] / scale[k][0] })).sort((x, y) => y.score - x.score)[0];
    const say = { side: [`${top.b} day${top.b === 1 ? '' : 's'}`, `of nausea a week, from ${top.a}`, 'bars'], steps: [`${fmt(top.b)}k`, `steps a day, from ${fmt(top.a)}k`, 'line'], hba: [`${fmt(top.b)}%`, `blood sugar (HbA1c), from ${fmt(top.a)}%`, 'line'], sleep: [`${fmt(top.b)}h`, `of sleep a night, from ${fmt(top.a)}h`, 'line'], energy: [`${top.b}/5`, `energy, from ${top.a}`, 'bars'], waist: [`${top.b}cm`, `waist, from ${top.a}cm`, 'line'] }[top.k];
    if (say) return big('Biggest change', say[0], say[1], mini(ser(top.a, top.b, say[2]), say[2], false, 300, 80, say[1]) + `<p class="quiet" style="margin-top:8px">Week by week, ${s.stage === 'early' ? 'since you started' : 'this month'}.</p>`);
  }
  if (s.stage === 'early') return big('Biggest change', `${v.side[1]} day${v.side[1] === 1 ? '' : 's'}`, `of nausea a week, from ${v.side[0]}`, mini(ser(...v.side, 'bars'), 'bars', false, 300, 80, 'Nausea days a week'));
  const quote = s.stage === 'middle' ? 'I eat when I’m hungry, and stop when I’m full.' : 'I don’t really think about it any more.';
  const fromStart = s.stage === 'plateau' && !s.slow, was = fromStart ? START_V.app : v.app[0];
  return big(s.slow ? 'What’s working' : 'Biggest change', `${v.app[1]}/10`, was === v.app[1] ? 'food noise, holding' : `food noise, from ${was}`, row(fromStart ? 'Week 1' : 'Last month', berries(was, 10)) + row('This month', berries(v.app[1], 10))) + `<p class="quote">“${quote}”<small>You, this month</small></p>`;
}

/* ===================== Card 3. A pattern, or what more data would show ===================== */
function pattern(s){
  const v = vals(s), stuck = s.below && s.stage !== 'early', flat = [s.pct, s.pct, s.pct, s.pct];
  if (stuck) return ['Your dose and weight this month.', ['Dose', mini(ser(s.dose, s.dose, 'step'), 'step', false, 300, 40, 'Dose')], ['Weight lost', mini(flat, 'line', false, 300, 40, 'Weight')]];
  if (s.slow) return ['Your appetite has changed.', ['Food noise', mini(ser(...v.app, 'line'), 'line', false, 300, 40, 'Food noise')], ['Weight lost', mini(ser(s.pct - .6, s.pct, 'line'), 'line', false, 300, 40, 'Weight')]];
  if (s.stage === 'early') return ['Nausea eased, and so did the food noise.', ['Nausea days', mini(ser(...v.side, 'bars'), 'bars', false, 300, 40, 'Nausea')], ['Food noise', mini(ser(...v.app, 'line'), 'line', false, 300, 40, 'Food noise')]];
  if (s.stage === 'middle') return ['You slept more, and had more energy.', ['Sleep', mini(ser(...v.sleep, 'line'), 'line', false, 300, 40, 'Sleep')], ['Energy', mini(ser(...v.energy, 'bars'), 'bars', false, 300, 40, 'Energy')]];
  return ['Weight steady, waist still shrinking.', ['Weight lost', mini(flat, 'line', false, 300, 40, 'Weight')], ['Waist', mini(ser(...v.waist, 'line'), 'line', false, 300, 40, 'Waist')]];
}
const delta = (l, [a, b], unit) => `<span class="chip">${l} ${b === a ? 'steady' : `${b > a ? '+' : '−'}${fmt(Math.abs(b - a) * (unit === 'min' ? 60 : 1))}${unit ? ' ' + unit : ''}`}</span>`;
function patternChips(s){
  const v = vals(s); if (!richOn(s)) return '';
  return `<p class="chips">${s.stage === 'early' ? delta('Nausea', v.side, 'days') + delta('Food noise', v.app, '') : s.stage === 'middle' ? delta('Sleep', v.sleep, 'min') + delta('Energy', v.energy, '') : '<span class="chip">Weight steady</span>' + delta('Waist', v.waist, 'cm')}</p>`;
}
const patternViz = p => p.slice(1).map(([l, x]) => `<div class="prow"><span class="quiet">${l}</span>${x}</div>`).join('');
function cardPattern(s){
  if (s.data !== 'rich'){ const empty = metrics(s).filter(m => m.empty);
    return `<p class="k">Next month could show</p><h1 class="lead" id="lead" tabindex="-1">${state.qDone ? 'More of you.' : 'A lot more of you.'}</h1><div class="tiles">${empty.slice(0, 4).map(m => tile(m, s)).join('')}</div><p class="quiet" style="margin-top:12px">${state.qDone ? 'A weigh-in each week adds the rest.' : 'A few taps at the end fill these in.'}</p>`; }
  const p = pattern(s);
  return `<p class="k">Something you might not have noticed</p><h1 class="lead" id="lead" tabindex="-1">${p[0]}</h1>${patternChips(s)}<div class="viz">${patternViz(p)}</div>`;
}

/* ===================== Card 4. A note from her care team ===================== */
function cardNote(s, full){
  const g = s.goal, clinical = s.concern, who = clinical ? ['Dr Lee', 'your prescriber', 'L'] : ['Priya', 'your coach', 'P'];
  let t;
  if (s.stall) t = 'I’m here if you’d like to talk anything through, including your dose. It’s a quick conversation.';
  else if (s.flags.length) t = 'Thank you for your answers. I’m here if you’d like to talk any of it through.';
  else if (s.slow) t = 'You’ve done everything we asked. I’m here if you’d like to look at your plan together.';
  else if (s.risk) t = 'A consistent month. I’m here if you’d like to look at your dose before your next order.';
  else if (s.data === 'none') t = `${state.qDone ? 'Thank you for telling us how it’s going.' : 'We don’t have much from you yet, and that’s okay.'} Your doses are on time, which matters most.`;
  else if (s.stage === 'early') t = 'Month 1 is the hardest, and you’ve done it. Nausea may return for a few days after your next step up, then settle.';
  else if (s.stage === 'middle') t = `A strong month, and not only on the scale.${g && g.close ? ` You’re ${g.left}kg from your goal.` : ''}`;
  else t = 'Eight weeks steady, and your blood results improved too. Holding is the goal now.';
  const R = (l, v) => `<div class="kv"><span>${l}</span><span>${v}</span></div>`;
  const first = s.stuck ? R('Dose review', 'Ready when you are') : s.slow ? R('Review with Dr Lee', 'Ready when you are') : s.stage === 'early' ? R('Next step, to 5mg', 'In 9 days') : s.stage === 'middle' ? R('Dose review', 'In 9 days') : R('6-month review', 'In 12 days');
  const rows = `<div class="card rows">${first}${R('Next order', NEXT_ORDER[state.monthIdx % NEXT_ORDER.length])}</div>`;
  if (full && !clinical) return rows;
  return `${full ? '' : `<p class="k">From ${who[1]}</p>`}<div class="note"><p ${full ? '' : 'id="lead" tabindex="-1"'}>${t}</p><p class="sig"><i aria-hidden="true">${who[2]}</i><span>${who[0]}${full ? `, ${who[1]}` : ''}<small>Written with June, signed by ${who[0]}</small></span></p></div>
    ${clinical && !full ? helpBtn(`Talk to ${who[0]}`) : ''}
    ${full ? rows : ''}`;
}

/* ===================== How far she's come: start and now on one line each ===================== */
const START_V = { app: 8, side: 4, energy: 2, hba: 6.1 };
function farRows(s){
  const v = vals(s), kg = START_KG * (1 - s.pct / 100), w0 = s.stage === 'early' ? 100 : 102;
  const rows = [['Food noise', START_V.app, v.app[1], 0, 10, '/10'], ['Nausea days', START_V.side, v.side[1], 0, 7, ''], ['Energy', START_V.energy, v.energy[1], 0, 5, '/5'], ['Waist', w0, v.waist[1], 88, 104, 'cm']];
  if (v.hba) rows.push(['Blood sugar', START_V.hba, v.hba[1], 5, 6.5, '%']);
  rows.push(['Weight', START_KG, +kg.toFixed(1), 76, 94, 'kg']);
  const pos = (x, lo, hi) => Math.max(4, Math.min(96, (x - lo) / (hi - lo) * 100));
  return rows.map(([l, a, b, lo, hi, u]) => { const pa = pos(a, lo, hi), pb = pos(b, lo, hi);
    return `<div class="db"><span>${l}</span><span class="track" role="img" aria-label="${l}: ${fmt(a)} at the start, ${fmt(b)} now"><b style="left:${Math.min(pa, pb)}%;width:${Math.abs(pa - pb)}%"></b><i class="a" style="left:${pa}%"></i><i class="b" style="left:${pb}%"></i></span><span><span class="quiet">${fmt(a)} →</span> ${fmt(b)}${u}</span></div>`; }).join('') + '<p class="quiet legend"><i class="a"></i>Week 1<i class="b"></i>Now</p>';
}
function cardFar(s){
  return `<p class="k">How far you’ve come</p><h1 id="lead" tabindex="-1"><span class="hero-num">${s.week} weeks</span><span class="hero-cap">since you started</span></h1><div class="viz">${farRows(s)}</div>`;
}

/* ===================== Last card. What's next: curious, not pressured ===================== */
// Only dates that are actually scheduled. No predictions about how next month will feel.
function nextSteps(s){
  const order = [NEXT_ORDER[state.monthIdx % NEXT_ORDER.length], 'Next order ships'];
  if (s.concern) return [['Any time', 'Your care team, one tap away'], order];
  const first = s.stage === 'early' ? ['In 9 days', 'Step up to 5mg'] : s.stage === 'middle' ? ['In 9 days', 'Dose review'] : ['In 12 days', 'Your 6-month review'];
  return [first, order];
}
// One tip, only when her own numbers show something she is struggling with. Clinical concerns go to the care team instead.
function tip(s){
  const m = Object.fromEntries(metrics(s).filter(x => !x.empty).map(x => [x.k, x.now]));
  if (m.side >= 1 && m.side < 5) return ['Nausea still shows up', 'Smaller meals on dose day usually ease it.'];
  if (m.energy <= 2) return ['Energy is low', 'Protein at breakfast and water through the day usually help.'];
  if (m.sleep < 6.5) return ['Sleep is short', 'A regular bedtime tends to help appetite too.'];
  return null;
}
function cardNext(s){
  const t = s.concern ? null : tip(s);
  const h = 'Coming up.';
  return `<p class="k">What’s next</p><h1 class="lead" id="lead" tabindex="-1">${h}</h1><ol class="tl">${nextSteps(s).map(([w, t]) => `<li><span class="quiet">${w}</span>${t}</li>`).join('')}</ol>${t ? `<div class="card tip"><p class="quiet">One thing to try</p><p><b>${t[0]}.</b> ${t[1]}</p></div>` : ''}${s.concern ? helpBtn('Talk to my care team') : '<p class="lede" style="margin-top:14px">See you next month.</p>'}`;
}

/* ===================== Card 5. Is it worth it? ===================== */
function pageWorth(s, full){
  const w = state.worth;
  const follow = w === 'yes' ? '<p class="lede">Glad to hear it. See you next month.</p>' : w ? `<p class="lede">Thanks for telling us. Your care team can help with what isn’t working.</p>${helpBtn('Talk to your care team')}` : '';
  const opts = `<div class="opts col">${[['yes', 'Good'], ['unsure', 'Mixed'], ['no', 'Not great']].map(([v, l]) => `<button class="opt" data-act="worth" data-v="${v}" aria-pressed="${w === v}">${l}</button>`).join('')}</div>${follow}`;
  if (full) return `<h2 class="sec">One last thing</h2><div class="card"><p class="q">How are you feeling about your progress?</p>${opts}</div>`;
  return `<p class="k">One last thing</p><h1 class="lead" id="lead" tabindex="-1">How are you feeling about your progress?</h1>
    ${opts}`;
}


/* ===================== Last card, when we need more data. One question at a time ===================== */
function pageQuestion(s){
  if (state.qDone) return `<p class="k">Thank you</p><h1 class="lead" id="lead" tabindex="-1">Your report is updated.</h1><p class="lede">${s.concern ? 'Your care team can see your answers.' : s.data === 'rich' ? 'Next month’s will stay accurate.' : 'Next month’s will have more of you in it.'}</p>`;
  const i = state.qi;
  if (i < QS.length){ const [k, text, opts] = QS[i];
    return `<p class="k">Question ${i + 1} of ${QS.length} · ${s.concern ? 'so your care team has the full picture' : s.data === 'rich' ? 'your monthly check-in' : 'your answers update your report'}</p><h1 class="lead sm" id="lead" tabindex="-1">${text}</h1>
      <div class="opts col">${opts.map(([v, l]) => `<button class="opt" data-act="q" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`; }
  const w = state.q.weight, d = w ? +(w - START_KG).toFixed(1) : 0;
  return `<p class="k">Last one, if you’d like</p><h1 class="lead sm" id="lead" tabindex="-1">What’s your weight today?</h1>
    <div class="wt"><label class="sr-only" for="wt">Weight in kilograms</label><input id="wt" type="number" inputmode="decimal" min="40" max="250" step="0.1" placeholder="kg" value="${w || ''}"><span class="quiet">kg</span></div>
    ${state.wPrompt ? `<div class="wcheck" role="alert"><p>Just checking. ${w.toFixed(1)}kg is ${Math.abs(d).toFixed(1)}kg ${d > 0 ? 'more' : 'less'} than when you started. Is that right?</p><div class="opts" style="margin-top:8px"><button class="opt" data-act="w-ok">Yes, that’s right</button><button class="opt" data-act="w-fix">Let me fix it</button></div></div>` : ''}
    <button class="btn" data-act="qdone">Update my report</button>`;
}


/* ===================== Get help ===================== */
// Infer before you ask: what the report already knows.
function seen(s){
  const L = [];
  if (s.stuck) L.push(`You’re on ${s.dose}mg`);
  if (s.data === 'rich' && s.below) L.push('Nausea 3 days a week');
  if (s.data === 'light' && s.below) L.push('You mentioned nausea to June');
  if (s.flags.includes('gain')) L.push('Your weigh-in today');
  if (s.flags.includes('side')) L.push('Side effects most days');
  if (s.flags.includes('appetite')) L.push('Your appetite answer today');
  if (s.slow) L.push('Every dose taken, and stepped up on schedule', `${fmt(s.pct)}% down so far`);
  if (s.data !== 'none' && s.below) L.push(`${fmt(s.pct)}% down so far`);
  if (s.data === 'none' && !state.qDone) L.push('Your doses have arrived on time');
  if (state.worth === 'unsure' || state.worth === 'no') L.push('You’re not feeling good about your progress');
  return L.length ? L : ['Your doses have arrived on time'];
}
const TOPICS = ['Side effects', 'My dose', 'My progress', 'Something else'];
function sheet(s){
  const h = state.help; if (!h) return '';
  // Two ways in, like the rest of the app: tap a topic, or hold to talk to June. June listens; a person on her care team reads it, or June talks it through first. (Scripted.)
  const said = s.flags.includes('side') ? 'The nausea is most days now, and it’s wearing me down.' : s.flags.includes('gain') ? 'My weight’s gone up and I’m not sure why.' : s.stuck ? 'I’m still on the starter dose and I’m not sure it’s doing much.' : s.slow ? 'I’m doing everything, and I’d like to know if my plan is right.' : state.worth && state.worth !== 'yes' ? 'I’m not sure how I feel about my progress.' : 'I’d like to talk through how it’s going.';
  const mic = '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  let body;
  if (h.step === 0) body = `<p class="big" id="sh-t">What would you like help with?</p>
    <div class="opts">${TOPICS.map(t => `<button class="opt" data-act="h-pick" data-v="${t}">${t}</button>`).join('')}</div>
    <p class="quiet" style="text-align:center;margin-top:18px">or talk to June</p><button class="mic" data-act="h-talk" aria-label="Hold to talk to June">${mic}</button><p class="quiet" style="text-align:center">Hold to talk</p>
    <p class="quiet" style="margin-top:18px">Your care team can already see:</p><ul class="checks">${seen(s).map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="flag">Severe stomach pain, vomiting that won’t stop, or trouble breathing? Call 000 or see a GP now.</p>`;
  else if (h.step === 1) body = `<p class="quiet" id="sh-t">${h.pick ? 'You’d like help with' : 'Here’s what I heard'}</p><p class="quote" style="margin-top:6px">${h.pick ? h.pick : `“${said}”`}</p>
    ${h.june ? `<div class="junesays"><p class="quiet">June</p><p>Thank you for telling me. That’s a fair thing to want looked at, and Dr Lee can go through it with you. Shall I send it?</p></div>` : ''}
    <button class="btn" data-act="h-send" data-v="prescriber">Send to Dr Lee</button>
    ${h.june ? '' : '<button class="btn soft" data-act="h-june" style="margin-top:8px">Talk it through with June first</button>'}
    <button class="link" data-act="h-back" style="display:block;margin:6px auto 0">${h.pick ? 'Change it' : 'Say it again'}</button>`;
  else body = `<p class="big" id="sh-t">Sent to ${HELP[state.helpSent].who}.</p><p>${HELP[state.helpSent].sent}</p><p class="quiet">They can see your report and your answers. Keep taking your doses as prescribed in the meantime.</p><button class="btn soft" data-act="h-close">Done</button>`;
  return `<div class="scrim" data-act="h-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="sheet-in"><button class="x" data-act="h-close" aria-label="Close">×</button>${body}</div></div></div>`;
}

/* ===================== Render ===================== */
function lock(s){
  const line = s.stall ? 'Come and see your month.' : s.risk || s.slow ? 'A consistent month. Come and see.' : s.stage === 'plateau' ? 'You’re holding your progress. Come and see your month.' : 'You’re making progress. Come and see what’s changed!';
  return `<div class="lock"><p>Monday 16 ${s.month}</p><div class="time">7:42</div><button class="notif" data-act="open"><span class="who"><i aria-hidden="true">J</i>June<span>now</span></span><b>Your ${s.month} report is ready</b>${line}</button></div>`;
}
function goalStrip(s){
  const g = s.goal; if (!g) return '';
  if (g.reached) return `<div class="card goalrow"><span>Your goal</span><span class="quiet">Reached</span></div>`;
  return `<div class="card ${g.close ? 'goal' : ''}"><div class="goalrow"><span>${g.close ? `<b>${g.left}kg</b> to your goal` : 'Your goal'}</span><span class="quiet">${g.close ? `about ${g.weeks} weeks` : `${g.pc}%`}</span></div><div class="range" role="img" aria-label="${g.pc} percent of the way to your goal"><s style="left:0;width:${g.pc}%"></s><u style="left:${g.pc}%"></u></div></div>`;
}
// A care team note only appears when there is something for them to say: a concern they are following up.
const pageFns = () => { const s = sc(); return (richOn(s) ? [cardLead, cardPattern, cardFar] : [cardLead, cardChange, cardPattern]).concat(s.concern ? [cardNote] : [], [cardNext], asks() ? [pageQuestion] : []); };
const pageNames = () => { const s = sc(); return (richOn(s) ? ['Biggest change', 'Something new', 'How far'] : ['Headline', 'Detail', 'Pattern']).concat(s.concern ? ['Care team'] : [], ['What’s next'], asks() ? ['Questions'] : []); };
function story(s){
  const fns = pageFns(), names = pageNames(), i = Math.min(state.page, fns.length - 1), body = fns[i](s);
  const tint = i === 0 ? (leadText(s).warm ? 'amber' : 'lilac') : '';
  const last = i === fns.length - 1, skip = last && asks() && !state.qDone;
  return `<div class="story ${tint}"><div class="segs" role="progressbar" aria-valuemin="1" aria-valuemax="${fns.length}" aria-valuenow="${i + 1}" aria-label="Card ${i + 1} of ${fns.length}: ${names[i]}">${fns.map((p, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div>
    <button class="close" data-act="close" aria-label="Close the report">×</button>
    <main class="pg" id="screen">${body}</main>
    <div class="nav ${last ? '' : 'has-skip'}"><button class="btn soft" data-act="back" ${i === 0 ? 'disabled' : ''}>Back</button><button class="btn" data-act="next">${skip ? 'Skip to full report' : last ? 'See your full report' : 'Next'}</button>${last ? '' : '<button class="link" data-act="full">Skip to full report</button>'}</div></div>${sheet(s)}${tileSheet(s)}`;
}
// Where the story lands: everything on one screen, to come back to during the month.
function full(s){
  const t = leadText(s), has = s.data !== 'none', w = has ? `${fmt(s.pct)}%` : s.wPct !== null ? (s.wPct >= 0 ? `${fmt(s.wPct)}%` : `+${fmt(-s.wPct)}%`) : '';
  const status = s.stall || s.slow || s.risk ? '' : s.below ? (s.stage === 'early' ? 'Early days' : '') : s.stage === 'plateau' ? 'Holding' : 'On track';
  const p = s.data === 'rich' ? pattern(s) : null, ms = metrics(s);
  return `<div class="story"><button class="close" data-act="close" aria-label="Close the report">×</button>
    <main class="pg full" id="screen">
      <div class="top"><p class="k">${s.month} · Month ${s.n}</p><h1 class="lead" id="lead" tabindex="-1">Your report</h1></div>
      ${t.cta ? `<div class="sum ${t.warm ? 'amber' : ''}"><p class="sumline">${t.warm || `${t.big} ${t.cap}`}</p>${t.fact ? `<p class="sumfact">${t.fact}</p>` : ''}${helpBtn(t.cta)}</div>` : ''}
      <div class="card wcard"><div class="goalrow"><span><span class="lbl">Weight</span><span class="num">${w ? `${w}<small>${w[0] === '+' ? 'up' : 'down'}</small>` : '<button class="link" data-act="ask">+ Add a weigh-in</button>'}</span></span>${has && status ? `<span class="chip">${status}</span>` : ''}</div>${chart(s, !has, 92)}</div>
      <p class="grp">How you feel</p><div class="tiles">${ms.slice(0, 4).map(m => tile(m, s)).join('')}</div>
      <p class="grp">Your body</p><div class="tiles">${ms.slice(4).map(m => tile(m, s)).join('')}</div>
      ${goalStrip(s)}
      ${asks() && !state.qDone ? `<div class="card ask"><span>Three quick questions<small class="quiet" style="display:block">${s.concern ? 'So your care team has the full picture.' : 'They fill in the empty tiles.'}</small></span><button class="link" data-act="ask">Answer</button></div>` : ''}
      ${p ? `<div class="card"><p class="why">${p[0]}</p>${patternViz(p)}</div><div class="card wcard"><p class="lbl">Since week 1</p>${farRows(s)}</div>` : ''}
      ${cardNote(s, true)}${!s.concern && tip(s) ? `<div class="card tip"><p class="quiet">One thing to try</p><p><b>${tip(s)[0]}.</b> ${tip(s)[1]}</p></div>` : ''}${pageWorth(s, true)}
      <button class="btn soft" data-act="open">Replay the story</button>
    </main></div>${sheet(s)}${tileSheet(s)}`;
}
function render(){
  const s = sc();
  // Keep the scroll position when the same view re-renders (a tap on the chart or an answer).
  const key = state.opened ? (state.full ? 'full' : state.page) : 'lock', old = $('#screen'), top = old && render._k === key ? old.scrollTop : 0;
  $('#app').innerHTML = !state.opened ? lock(s) : state.full ? full(s) : story(s);
  const scr = $('#screen'); if (scr) scr.scrollTop = top; render._k = key;
  document.querySelectorAll('.seg-row[data-k]').forEach(el => { const k = el.dataset.k; const off = k === 'goal' && !(state.stage === 'middle' && state.progress === 'on' && state.data !== 'none');
    el.classList.toggle('wrap', k === 'progress');
    el.innerHTML = CONTROLS[k].map(([v, l]) => `<label ${off ? 'class="off"' : ''}><input type="radio" name="${k}" value="${v}" ${state[k] === v ? 'checked' : ''} ${off ? 'disabled' : ''}><span>${l}</span></label>`).join(''); });
  const names = pageNames(); if (state.page > names.length - 1) state.page = names.length - 1;
  $('#pages').innerHTML = names.map((p, j) => `<button data-act="page" data-i="${j}" aria-pressed="${state.opened && !state.full && state.page === j}" title="${p}">${j + 1}</button>`).join('') + `<button data-act="full" aria-pressed="${state.opened && state.full}" title="The full report" style="flex:1.6">Full</button>`;
}
function freshVisit(){ state.q = {}; state.qi = 0; state.qDone = false; state.wPrompt = false; state.wOk = false; state.worth = null; state.chart = false; state.help = null; state.helpSent = null; state.tile = null; }
function openFull(){ state.opened = true; state.full = true; state.chart = false; render(); const l = $('#lead'); l && l.focus({ preventScroll: true }); }
function go(i){ const n = pageFns().length; if (i >= n) return openFull(); state.opened = true; state.full = false; state.page = Math.max(0, Math.min(n - 1, i)); state.chart = false; render(); const l = $('#lead'); l && l.focus({ preventScroll: true }); }
// Every answer is paid back straight away: the next page is built from it.
function finish(){ state.qDone = true; state.wPrompt = false; state.page = pageFns().length - 1; render(); toast('Your report is updated'); }
// The flywheel: answering this month makes next month's report richer.
function nextMonth(){
  const did = state.qDone, up = { none: 'light', light: 'rich', rich: 'rich' }[state.data];
  if (did) state.data = up;
  state.monthIdx++; freshVisit(); state.opened = false; state.full = false; state.page = 0; render();
  { const mo = MONTHS[state.monthIdx % MONTHS.length]; toast(did ? `${mo} report: her answers made it richer` : state.data === 'rich' ? `${mo} report` : `${mo} report: no answers, so nothing new`); }
}
function closeHelp(){ state.help = null; state.tile = null; render(); const b = $('[data-act="help"]') || $('#lead'); b && b.focus({ preventScroll: true }); }
document.addEventListener('change', e => { const n = e.target.name; if (CONTROLS[n]){ state[n] = e.target.value; freshVisit(); render._k = null; render(); const r = document.querySelector(`input[name="${n}"]:checked`); r && r.focus(); } });
document.addEventListener('input', e => { if (e.target.id === 'wt'){ const v = parseFloat(e.target.value); state.q.weight = v >= 40 && v <= 250 ? v : null; state.wOk = false; if (state.wPrompt){ state.wPrompt = false; const c = $('.wcheck'); c && c.remove(); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (state.help || state.tile)) closeHelp(); else if (state.opened && !state.full && !state.help && !state.tile && e.target.tagName !== 'INPUT'){ if (e.key === 'ArrowRight') go(state.page + 1); if (e.key === 'ArrowLeft') go(state.page - 1); } });
// Holding the mic shows it listening; letting go (or a tap, or Enter) hands over what she said.
document.addEventListener('pointerdown', e => { const m = e.target.closest('.mic'); if (m) m.classList.add('on'); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'h-scrim' && e.target !== el) return;
  switch (a){
    case 'open': go(0); break;
    case 'next': go(state.page + 1); break;
    case 'back': go(state.page - 1); break;
    case 'page': go(+el.dataset.i); break;
    case 'close': state.opened = false; state.full = false; state.page = 0; render(); break;
    case 'full': openFull(); break;
    case 'tile': state.tile = el.dataset.k; render(); $('.x').focus(); break;
    case 'ask': case 'add': if (asks() && !state.qDone) go(pageFns().length - 1); else toast('Log it once in the app and it appears here next month'); break;
    case 'q': state.q[el.dataset.k] = v; state.qi++; if (state.qi === QS.length && state.data !== 'none') finish(); else { render(); const b = $('.pg .opt') || $('#wt'); b && b.focus({ preventScroll: true }); } break;
    case 'w-ok': state.wOk = true; finish(); break;
    case 'w-fix': state.wPrompt = false; render(); $('#wt').focus(); $('#wt').select(); break;
    case 'qdone': if (wImplausible(state.q.weight) && !state.wOk){ state.wPrompt = true; render(); const c = $('.wcheck button'); c && c.focus(); } else finish(); break;
    case 'chart': state.chart = !state.chart; render(); $('[data-act="chart"]').focus({ preventScroll: true }); break;
    case 'worth': state.worth = v; render(); { const b = $(`[data-act="worth"][data-v="${v}"]`); b && b.focus({ preventScroll: true }); } break;
    case 'help': state.help = { step: 0 }; render(); $('.x').focus(); break;
    case 'h-pick': state.help = { step: 1, pick: v }; render(); $('[data-act="h-send"]').focus(); break;
    case 'h-talk': state.help.step = 1; render(); $('.sheet').scrollTop = 0; $('[data-act="h-send"]').focus(); break;
    case 'h-june': state.help.june = true; render(); $('[data-act="h-send"]').focus(); break;
    case 'h-back': state.help = { step: 0 }; render(); $('.x').focus(); break;
    case 'h-send': state.helpSent = v; state.help.step = 2; render(); $('.x').focus(); break;
    case 'h-close': case 'h-scrim': closeHelp(); break;
    case 'nextmonth': nextMonth(); break;
    case 'reset': state = initial(); render(); break;
  }
});
if (matchMedia('(max-width:860px)').matches) $('#demoDetails').open = false;
render();
</script>
</body>
</html>
