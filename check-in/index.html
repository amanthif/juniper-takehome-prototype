<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pre-emptive Check-In · Prototype</title>
<meta name="description" content="Working prototype: spotting a stalled user from early signals and checking in before they feel it isn't working. Illustrative data only.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F1ECF2; --surface:#FFFFFF; --surface-2:#FAF5FB; --ink:#1F2A24; --muted:#56605A; --line:#E8E1EA;
  --brand:#1E3B2C; --brand-soft:#E6EEE8; --accent:#7E52B8; --accent-soft:#EFE6F8;
  --warn-ink:#7A4E00; --warn-soft:#FFF3D6;
  --radius:20px; --shadow:0 1px 2px rgba(31,42,36,.05),0 6px 20px rgba(31,42,36,.06);
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

.layout{display:grid;grid-template-columns:minmax(300px,400px) auto;gap:44px;justify-content:center;align-items:start;padding:36px 24px}
.stage{position:sticky;top:24px}
.phone{width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;background:#141816;border-radius:52px;padding:12px;box-shadow:0 30px 60px rgba(31,42,36,.25)}
.app{position:relative;height:100%;background:var(--surface-2);border-radius:40px;overflow:hidden;display:flex;flex-direction:column}

/* ---------- left: the system's view ---------- */
.side{font-size:14px}
.side h1{font-family:var(--serif);font-weight:400;color:var(--brand);font-size:28px;line-height:1.12;margin:0 0 6px}
.side .intro{color:var(--muted);margin:0 0 16px}
.side summary{display:none}
fieldset.seg{border:0;padding:0;margin:0 0 14px}
fieldset.seg legend{font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;padding:0}
.seg-row{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg-row label{flex:1;position:relative}
.seg-row input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg-row span{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;font-weight:500;text-align:center;padding:2px 6px;cursor:pointer;line-height:1.2;font-size:13px}
.seg-row input:checked+span{background:var(--brand);color:#fff}
.seg-row input:focus-visible+span{outline:3px solid var(--accent);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.panel h2{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.panel h2 .tag{letter-spacing:0;text-transform:none;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.panel h2 .tag.fire{background:var(--accent-soft);color:var(--accent)}
.panel h2 .tag.ok{background:var(--brand-soft);color:var(--brand)}
.player{display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--brand);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
.player input[type=range]{flex:1;accent-color:var(--brand);min-height:44px}
.wk{font-weight:600;min-width:62px;text-align:right}
.signals{list-style:none;margin:8px 0 0;padding:0}
.signals li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:flex-start;transition:opacity .3s}
.signals li:first-child{border-top:0}
.signals li.future{opacity:.28}
.signals .w{flex:none;width:40px;font-size:12px;font-weight:600;color:var(--muted);padding-top:1px}
.signals .d{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px;background:#D9D2DD}
.signals li.on .d.warn{background:#C98A1B}
.signals li.on .d.ok{background:var(--brand)}
.signals .t{font-weight:500;line-height:1.3}
.signals .s{font-size:12px;color:var(--muted)}
.status{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px}
.status.fire{background:var(--accent-soft)}
.case table{width:100%;border-collapse:collapse;font-size:13px}
.case td{padding:6px 0;border-top:1px solid var(--line);vertical-align:top}
.case tr:first-child td{border-top:0}
.case td:first-child{color:var(--muted);width:40%;padding-right:8px}
.case .sugg{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px}
.case .sugg b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.link-btn{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.foot{color:var(--muted);font-size:12px;margin-top:8px}

/* ---------- phone chrome ---------- */
.screen{flex:1;overflow-y:auto;position:relative;scroll-behavior:smooth}
.floatbar{display:flex;justify-content:space-between;align-items:center;padding:52px 16px 0}
.fbtn{min-width:44px;height:44px;border-radius:99px;border:0;background:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(31,42,36,.08);display:inline-flex;align-items:center;justify-content:center;padding:0 14px;font-weight:600;font-size:14px;cursor:pointer}
.fbtn.av{padding:0;width:44px;color:var(--accent)}
.tabbar{flex:none;display:flex;justify-content:space-around;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:6px 4px 22px}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);min-height:48px;cursor:pointer;padding-top:4px}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.pad{padding:0 16px 24px}
.hello{font-family:var(--serif);font-weight:400;color:var(--brand);font-size:32px;line-height:1.1;margin:18px 2px 4px}
.sub{color:var(--muted);margin:0 2px 8px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h3{margin:0;font-size:16px;font-weight:600;color:var(--brand)}
.row{display:flex;align-items:center;gap:12px}
.tile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--brand-soft);color:var(--brand)}
.tile.p{background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--brand-soft);color:var(--brand)}
.chip.grey{background:#EFEAF1;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:10px;border:0;font-weight:600;font-size:16px;cursor:pointer;padding:0 16px;background:var(--brand);color:#fff;margin-top:12px;text-align:center}
.btn.soft{background:var(--surface-2);color:var(--brand)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:44px;font-size:14.5px;width:auto;display:inline-flex;margin-top:8px}

/* lock screen */
.lock{position:absolute;inset:0;background:linear-gradient(170deg,#2B2440 0%,#4A3B6E 45%,#8C79B9 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:70px 14px 30px}
.lock .date{font-size:17px;font-weight:500;opacity:.9}
.lock .time{font-size:84px;font-weight:300;letter-spacing:-2px;line-height:1;margin:2px 0 30px}
.notif{width:100%;background:rgba(255,255,255,.82);backdrop-filter:blur(20px);color:var(--ink);border-radius:20px;padding:12px 14px;text-align:left;border:0;cursor:pointer;animation:drop .5s ease-out}
@keyframes drop{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.notif .top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#555;margin-bottom:3px}
.notif .appic{width:22px;height:22px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.notif b{display:block;font-size:15px}
.notif span.m{font-size:14.5px;line-height:1.35;display:block}
.lock .hint{margin-top:auto;font-size:13px;opacity:.85}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding:8px 16px 16px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.4}
.msg.june{background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--brand);color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.june-tag{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:6px 0 -4px}
.june-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#7E52B8,#1E3B2C);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:#A8B3AF;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.noticed{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;align-self:stretch}
.noticed h4{margin:0 0 2px;font-family:var(--serif);font-weight:400;font-size:20px;color:var(--brand)}
.noticed ul{list-style:none;margin:8px 0 0;padding:0}
.noticed li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.noticed li:first-child{border-top:0}
.noticed li .d{width:8px;height:8px;border-radius:50%;background:#C98A1B;flex:none;margin-top:7px}
.noticed li .d.ok{background:var(--brand)}
.noticed li small{display:block;color:var(--muted);font-size:12px}
.reply-bar{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px 18px}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;font-weight:500}
.opt:hover{border-color:var(--accent)}
.talkrow{display:flex;align-items:center;gap:12px}
.talk{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 14px rgba(30,59,44,.3)}
.talk.sm{width:44px;height:44px;box-shadow:none;background:var(--accent-soft);color:var(--accent)}
.talkrow .lbl{flex:1;font-size:14.5px;line-height:1.3}
.talkrow .lbl b{display:block;color:var(--brand)}
.talkrow .lbl span{color:var(--muted);font-size:13px}
.orhold{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.listening{display:flex;align-items:center;gap:14px;min-height:60px}
.listening .pulse{flex:none;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(126,82,184,.45)}50%{box-shadow:0 0 0 14px rgba(126,82,184,0)}}
.listening b{display:block;color:var(--brand)}
.listening span{font-size:13px;color:var(--muted)}
.msg.me.voice::before{content:"Spoken · ";font-size:12px;opacity:.75}
.heard{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;align-self:stretch}
.heard h4{margin:0 0 2px;font-family:var(--serif);font-weight:400;font-size:20px;color:var(--brand)}
.heard .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.hchip{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--brand);border-radius:10px;min-height:44px;padding:4px 12px;font-size:14px;cursor:pointer;text-align:left;line-height:1.25}
.hchip small{display:block;color:var(--muted);font-size:11.5px}
.hchip.win{border-color:var(--brand);background:var(--brand-soft)}
.hchip[disabled]{cursor:default;opacity:1}
.guard{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}

/* plan + closed */
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;flex:none;font-size:13px}
.steps b{display:block;font-size:15px}
.steps span{font-size:13.5px;color:var(--muted)}
.sent{background:var(--brand-soft);border-radius:16px;padding:14px 16px;margin:12px 0;font-size:14.5px}
.sent b{display:block}
.inbox{display:flex;gap:12px;align-items:flex-start}
.inbox .av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.inbox .who{font-weight:600}
.inbox .when{font-size:12px;color:var(--muted)}
.inbox p{margin:6px 0 0;font-size:15px}
.tracker{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tracker div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.tracker .k{font-size:12.5px;color:var(--muted)}
.tracker .v{font-family:var(--serif);font-size:20px;color:var(--brand)}
.tracker .v.new{color:var(--accent)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1F2A24;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100vw - 32px);z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.listening .pulse{animation:none}.notif{animation:none}.typing i{animation:none}.screen{scroll-behavior:auto}.signals li{transition:none}}

@media (max-width:900px){
  .layout{display:block;padding:0}
  .side{padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .side summary{display:flex;align-items:center;min-height:44px;font-weight:600;cursor:pointer}
  .side h1{font-size:22px;margin-top:6px}
  .stage{position:static}
  .phone{width:100%;height:auto;min-height:0;background:none;border-radius:0;padding:0;box-shadow:none}
  .app{border-radius:0;height:auto;min-height:100vh;overflow:visible}
  .screen{overflow:visible}
  .floatbar{padding-top:12px}
  .lock{position:relative;min-height:100vh}
  .tabbar,.reply-bar{position:sticky;bottom:0;z-index:4}
}

/* calm style: flat cards, one accent, dots for data, three text sizes */
body{font-size:15px;line-height:1.5}
.card,.noticed,.heard,.msg.june,.phone,.talk,.fbtn{box-shadow:none}
.card{border-radius:18px;margin:10px 0}
.card p{margin:0}
.side h1{font-size:24px;margin-bottom:18px}
.panel{border-radius:14px}
.hello{font-size:22px;line-height:1.2;margin:0 2px 10px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kv+.kv{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.kv span:last-child{color:var(--muted);font-size:13px;text-align:right}
.tab{font-size:12px;justify-content:center}
.lock{background:#2F2845}
.lock .time{font-size:80px;margin:2px 0 32px}
.notif{background:rgba(255,255,255,.9);backdrop-filter:none;padding:14px 16px}
.notif .appic{border-radius:50%}
.notif b{font-size:16px;font-weight:600}
.notif span.m{font-size:15px}
.msg{font-size:15px;border-radius:18px}
.noticed h4,.heard h4{font-size:22px}
.noticed li .d,.noticed li .d.ok{background:var(--brand)}
.hchip{border:0;border-radius:99px;padding:6px 14px}
.hchip.win{background:var(--brand);color:#fff}
.hchip.win small{color:rgba(255,255,255,.8)}
.opt{border-radius:99px}
.btn{border-radius:12px;min-height:50px}
.btn.soft{background:var(--accent-soft);color:var(--brand)}
.steps li::before{content:"";width:8px;height:8px;margin:7px 4px 0;background:var(--brand)}
.sent{border-radius:18px;background:var(--accent-soft)}
.inbox .av{background:var(--brand);color:#fff}
.hero{background:var(--accent-soft);border-radius:22px;padding:20px 18px}
.hero p{margin:0;color:#3E4A44}
.hero .k{font-size:13px;font-weight:500;color:var(--accent)}
.hero .big{font-family:var(--serif);color:var(--brand);font-size:22px;line-height:1.2;margin:6px 0 8px}
.range{position:relative;height:8px;border-radius:4px;background:var(--line);margin-top:12px}
.range s{position:absolute;top:0;bottom:0;border-radius:4px;background:#CFC3F5}
.range u{position:absolute;top:-4px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--brand);border:3px solid var(--surface)}
.scrim{position:absolute;inset:0;background:rgba(20,24,22,.35);z-index:6;display:flex;align-items:flex-end}
.sheet{position:relative;background:var(--surface);width:100%;border-radius:26px 26px 0 0;padding:22px 20px 28px}
.sheet-t{font-family:var(--serif);font-weight:400;color:var(--brand);font-size:22px;line-height:1.2;margin:0 44px 8px 0}
.sheet .x{position:absolute;right:14px;top:14px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:20px}
.said{font-family:var(--serif);font-size:20px;color:var(--brand);line-height:1.3;margin:10px 0 0}
.btn svg{flex:none}
@media (max-width:900px){.scrim{position:fixed}}
.try{background:var(--accent-soft);border-radius:14px;padding:12px 16px;margin:0 0 16px}
.try b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.try ol{margin:0;padding-left:18px}
.try li{margin:3px 0}
.more{margin:0 0 12px}
.more>summary{display:flex!important;align-items:center;min-height:44px;font-weight:600;color:var(--brand);cursor:pointer}
</style>
</head>
<body>
<div class="layout">
  <aside class="side" aria-label="What the system sees">
    <details id="sideDetails" open>
      <summary>What we see behind the scenes</summary>
      <h1>Pre-emptive Check-In</h1>

      <fieldset class="seg"><legend>Scenario</legend><div class="seg-row">
        <label><input type="radio" name="scenario" value="dose" checked><span>Stalled, feels fine</span></label>
        <label><input type="radio" name="scenario" value="drift"><span>Gone quiet</span></label>
        <label><input type="radio" name="scenario" value="noresp"><span>Doing it all, not responding</span></label></div></fieldset>

      <fieldset class="seg" id="sayPick" hidden><legend>When she holds to talk, Sarah says</legend><div class="seg-row">
        <label><input type="radio" name="say" value="busy" checked><span>Fine, just busy</span></label>
        <label><input type="radio" name="say" value="scale"><span>Avoiding the scale</span></label>
        <label><input type="radio" name="say" value="side"><span>Struggling</span></label></div></fieldset>
      <div class="panel" id="timeline"></div>
      <div class="panel case" id="case"></div>
      <button class="link-btn" data-act="reset">Reset demo</button>
      <p class="foot">Sarah is fictional. Data is illustrative and June is scripted.</p>
    </details>
  </aside>
  <div class="stage"><div class="phone"><div class="app" id="app"></div></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== Scenarios (illustrative) ===================== */
const band = w => { const k = 1 - Math.exp(-w / 22); return { lo: -10 * k, hi: -22 * k }; };
const SC = {
  dose: {
    persona: 'Stalled but feels fine', weeks: 16, flag: 8, churn: 13, churnTxt: 'says “it’s not working” and cancels at renewal',
    lastWeigh: 8, dose: 2.5, nextDose: 5,
    pct: w => w <= 4 ? -0.45 * w : -1.8 - 0.12 * (w - 4),
    recover: w => -2.3 - 0.55 * (w - 8),
    signals: [
      { w: 4, t: 'Step-up to 5mg didn’t happen', s: 'Prescription & orders', k: 'warn' },
      { w: 5, t: 'Every dose and weigh-in logged', s: 'App activity', k: 'ok' },

    : [w > 1 ? `You haven’t missed a dose in ${w} weeks.` : 'You’ve taken your first dose.', `You’re on ${dose}mg, right on schedule.`];
  const weighed = w <= s.lastWeigh || !!lg.weight, b = band(w), lost = lg.weight ? (92 - QUICK.kg) / 92 * 100 : -s.pct(w), lo = -b.lo, hi = -b.hi, max = Math.max(hi * 1.35, 1), pc = v => Math.max(0, Math.min(100, v / max * 100)).toFixed(1);
  const status = !weighed ? 'No weigh-in this week' : lost >= lo || w <= 2 ? `On track for week ${w}` : w < 9 ? 'Early days' : 'Holding';
  return `<main class="screen" id="screen">${floatbar()}<div class="pad">
    <h2 class="hello">Hey Sarah</h2>
    <div class="hero"><p class="k">Week ${w}</p><p class="big">${lead[0]}</p><p>${lead[1]}</p></div>
    <div class="card"><div class="kv"><span>Weight</span><span>${status}</span></div>${weighed ? `<div class="range" role="img" aria-label="${status}"><s style="left:${pc(lo)}%;width:${pc(hi - lo)}%"></s><u style="left:${pc(lost)}%"></u></div>` : `<button class="btn soft" data-act="quick" style="margin-top:14px">${I.mic}<span style="margin-left:8px">Tell June instead</span></button>`}</div>
    ${sc === 'dose' && w >= 4 ? `<div class="card"><p>Ready for 5mg?</p><p class="small muted">Step up whenever you feel ready.</p><button class="btn sm soft" data-act="todo">Not yet</button></div>` : ''}
    <div class="card"><div class="kv"><span>Next dose</span><span>Thursday · ${dose}mg</span></div></div>
    <div class="card"><div class="kv"><span>Steps</span><span>4,312 of 4,000</span></div><div class="kv"><span>Protein</span><span>Log a meal</span></div><div class="kv"><span>Water</span><span>Log water</span></div></div>
  </div></main>${tabbar('Today')}`;
}

// Quick logging by voice: she says it in a sentence, June turns it into logs, she confirms. Scripted, no microphone.
const QUICK = { kg: 88.4, t: 'I’m 88.4 kilos this morning. I’ve taken every dose, I just haven’t logged them. The nausea has gone.',
  chips: { weight: ['Weight', '88.4 kg'], doses: ['Doses', 'Taken every week'], side: ['Side effects', 'No nausea'] } };
function quickSheet(){
  const q = state.quick; if (!q) return '';
  let body;
  if (q.listening) body = `<div class="listening" role="status" style="margin-top:14px"><span class="pulse">${I.mic}</span><span><b>Listening</b><span>Let go to send</span></span></div>`;
  else if (q.heard) body = `<p class="said">“${QUICK.t}”</p><p class="small muted" style="margin:14px 0 8px">Here’s what I heard. Tap anything that’s wrong to remove it.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">${q.heard.map(k => `<button class="hchip" data-act="q-x" data-k="${k}" aria-label="Remove ${QUICK.chips[k][1]}"><small>${QUICK.chips[k][0]}</small>${QUICK.chips[k][1]} ×</button>`).join('')}</div>
    <button class="btn" data-act="q-ok" ${q.heard.length ? '' : 'disabled'}>Log it</button>`;
  else body = `<p class="small muted">No forms. Say it in a sentence and I’ll log it for you.</p>
    <div class="talkrow" style="margin-top:16px">${talkBtn()}<span class="lbl"><b>Hold to talk</b><span>Your weight, your doses, how you’ve felt</span></span></div>`;
  return `<div class="scrim" data-act="q-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="q-t"><button class="x" data-act="q-close" aria-label="Close">×</button><h3 class="sheet-t" id="q-t">Tell June how your week went</h3>${body}</div></div>`;
}
function lockScreen(){
  const s = S();
  return `<div class="lock"><div class="date">Monday 16 November</div><div class="time">7:42</div>
    <button class="notif" data-act="open-chat" aria-label="Notification from your care team: ${esc(s.notif[0])}. Open.">
      <span class="top"><span class="appic">J</span>June<span style="margin-left:auto">now</span></span>
      <b>${esc(s.notif[0])}</b><span class="m">${esc(s.notif[1])}</span></button></div>`;
}

function newChat(){ return { log: S().opener.map(t => ({ who: 'june', t })), step: -1, answers: {}, opts: [], typing: false, listening: false, heard: null, said: null, done: false, sent: false }; }
const script = () => { const s = S(); return s.say[state.say] || s.say.def; };
const talkBtn = small => `<button class="talk ${small ? 'sm' : ''}" data-talk aria-label="Tap to answer with buttons. Hold to talk to June.">${I.mic}</button>`;
function replyBar(c){
  const guard = '<p class="guard">June is an AI assistant. Clinical decisions are made by your care team.</p>';
  if (c.listening) return `<div class="reply-bar"><div class="listening" role="status"><span class="pulse">${I.mic}</span><span><b>Listening</b><span>Let go to send</span></span></div></div>`;
  if (c.done) return `<div class="reply-bar"><button class="btn" style="margin:0" data-act="to-plan">See the plan</button></div>`;
  if (c.typing || c.heard) return `<div class="reply-bar">${guard.replace('margin:8px 0 0', '')}</div>`;
  // Before the first answer: one button. Tap for quick answers, hold to say it.
  if (c.step < 0) return `<div class="reply-bar"><div class="talkrow">${talkBtn()}<span class="lbl"><b>Tap to answer</b><span>or hold to talk to June</span></span>${c.step === -1 ? '<button class="opt" data-act="chat" data-v="later">Not now</button>' : ''}</div>${guard}</div>`;
  return `<div class="reply-bar"><div class="opts" role="group" aria-label="Reply options">${c.opts.map(o => `<button class="opt" data-act="chat" data-v="${o[0]}">${esc(o[1])}</button>`).join('')}</div>
    <div class="orhold">${talkBtn(true)}<span>or hold to say the rest</span></div>${guard}</div>`;
}
function chatScreen(){
  const c = state.chat; let out = '', last = null;
  for (const m of c.log){
    if ((m.who === 'june' || m.who === 'heard') && last !== 'june') out += `<div class="june-tag"><span class="june-av" aria-hidden="true">J</span>June</div>`;
    if (m.who === 'noticed') out += noticedCard();
    else if (m.who === 'heard') out += heardCard(m.h);
    else out += `<div class="msg ${m.who} ${m.voice ? 'voice' : ''}"><span class="sr-only">${m.who === 'june' ? 'June: ' : 'You: '}</span>${esc(m.t)}</div>`;
    last = m.who === 'heard' ? 'june' : m.who;
  }
  if (c.typing) out += `<div class="msg june typing" aria-label="June is typing"><i></i><i></i><i></i></div>`;
  return `<header class="row" style="padding:52px 12px 6px;gap:6px"><button class="fbtn" style="box-shadow:none;background:none;padding:0;width:44px" data-act="back-lock" aria-label="Back">${I.back}</button><div><div style="font-weight:600">June</div><div class="small muted" style="font-size:12px">Care team assistant</div></div></header>
    <main class="screen" id="screen"><div class="chat" aria-live="polite">${out}</div></main>${replyBar(c)}`;
}
// What June picked up from what Sarah said. She can remove anything that's wrong before it's saved.
function heardCard(h){
  const c = state.chat, s = S(), live = c.heard === h;
  const chips = h.keys.map(k => { const q = s.qs.find(x => x.k === k); return `<button class="hchip" ${live ? `data-act="unhear" data-k="${k}" aria-label="Remove: ${esc(q.o.find(o => o[0] === h.answers[k])[1])}"` : 'disabled'}><small>${esc(q.q.replace(/\?.*$/, '?'))}</small>${esc(q.o.find(o => o[0] === h.answers[k])[1])}${live ? ' ×' : ''}</button>`; })
    .concat(h.extra.map(([id, tag, t]) => `<button class="hchip ${id === 'win' ? 'win' : ''}" ${live ? `data-act="unhear-x" data-k="${id}" aria-label="Remove: ${esc(t)}"` : 'disabled'}><small>${esc(tag)}</small>${esc(t)}${live ? ' ×' : ''}</button>`));
  return `<div class="heard"><h4>Here’s what I heard</h4><p class="small muted" style="margin:0">${live ? 'Tap anything I got wrong to remove it.' : 'Saved, so you won’t need to repeat it.'}</p>
    <div class="chips">${chips.join('') || '<span class="small muted">Nothing kept.</span>'}</div>
    ${live ? `<button class="btn" style="margin:12px 0 0" data-act="heard-ok">That’s right</button>` : ''}</div>`;
}
const pause = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 150 : 700;
// Ask the next unanswered question, or finish.
function nextQuestion(){
  const c = state.chat, s = S();
  while (c.step < s.qs.length && c.answers[s.qs[c.step].k] !== undefined) c.step++;
  if (c.step < s.qs.length){ const q = s.qs[c.step]; c.log.push({ who: 'june', t: q.q }); c.opts = q.o; }
  else { c.opts = []; c.done = true; c.log.push({ who: 'june', t: 'Thank you, Sarah. That’s everything I need. Here’s what happens next.' }); }
}
function chatAnswer(v){
  const c = state.chat, s = S(); if (c.typing || c.heard) return;
  if (v === 'go'){ c.typing = true; render(); setTimeout(() => { c.typing = false; if (!s.quiet) c.log.push({ who: 'noticed' }); c.step = 0; nextQuestion(); render(); }, pause()); return; }
  const label = v === 'later' ? 'Not right now' : (c.opts.find(o => o[0] === v) || [, v])[1];
  c.log.push({ who: 'me', t: label }); c.opts = []; c.typing = true; render();
  setTimeout(() => {
    c.typing = false;
    if (v === 'later'){ c.log.push({ who: 'june', t: 'No problem at all. I’ll check back tomorrow, or come back here whenever suits you.' }); c.step = -2; render(); return; }
    const q = s.qs[c.step]; c.answers[q.k] = v; c.log.push({ who: 'june', t: q.a[v] }); c.step++;
    nextQuestion(); render();
  }, pause());
}
// Hold to talk: one sentence in her own words answers everything still open (scripted, not a live model).
function startTalk(){ if (state.quick){ if (!state.quick.listening && !state.quick.heard){ state.quick.listening = true; render(); } return; } const c = state.chat; if (!c || c.typing || c.heard || c.done || c.listening) return; c.listening = true; render(); }
function endTalk(){
  if (state.quick){ if (state.quick.listening){ state.quick.listening = false; state.quick.heard = Object.keys(QUICK.chips); render(); } return; }
  const c = state.chat, s = S(); if (!c || !c.listening) return;
  const sc = script(), keys = s.qs.map(q => q.k).filter(k => c.answers[k] === undefined && sc.answers[k] !== undefined);
  c.listening = false; c.said = sc.t; c.opts = []; c.log.push({ who: 'me', t: sc.t, voice: true }); c.typing = true; render();
  setTimeout(() => { c.typing = false; c.heard = { keys, answers: sc.answers, extra: (c.heardOnce ? [] : sc.extra || []).slice(), reply: sc.reply }; c.heardOnce = true; c.log.push({ who: 'heard', h: c.heard }); render(); }, pause() + 300);
}
function heardOk(){
  const c = state.chat, h = c.heard; if (!h) return;
  h.keys.forEach(k => c.answers[k] = h.answers[k]); h.extra.forEach(([id]) => c.answers['x_' + id] = true);
  c.heard = null; c.typing = true; render();
  setTimeout(() => { c.typing = false; c.log.push({ who: 'june', t: h.reply }); if (c.step < 0) c.step = 0; nextQuestion(); render(); }, pause());
}
function noticedCard(){
  const s = S(), sig = s.signals.filter(x => x.w <= s.flag);
  return `<div class="noticed"><h4>What we noticed</h4><p class="small muted" style="margin:0">Here’s what we looked at.</p>
    <ul>${sig.map(x => `<li><span class="d ${x.k === 'ok' ? 'ok' : ''}"></span><span>${esc(x.t)}<small>Week ${x.w} · ${esc(x.s)}</small></span></li>`).join('')}</ul></div>`;
}
function planScreen(){
  const s = S(), a = state.chat.answers, route = s.route(a), sent = state.chat.sent;
  const who = route === 'prescriber' ? 'your prescriber' : 'your coach';
  return `<main class="screen" id="screen"><div class="row" style="padding:52px 12px 0"><button class="fbtn" style="box-shadow:none;background:none;padding:0;width:44px" data-act="back-chat" aria-label="Back to chat">${I.back}</button></div><div class="pad">
    <h2 class="hello" style="margin-top:4px">Here’s the plan</h2><p class="sub">Caught early, so it’s a small fix.</p>
    <div class="card"><ol class="steps">${s.steps(a).map(x => `<li><span><b>${esc(x[0])}</b><span>${esc(x[1])}</span></span></li>`).join('')}</ol></div>
    ${sent ? `<div class="sent" role="status"><b>Sent to ${who}</b>They can see your answers and what we noticed. You’ll get a message here.</div>
      <button class="btn soft" data-act="skip">See the next day</button>`
      : `<button class="btn" data-act="send">Send to ${who}</button><p class="small muted" style="text-align:center;margin:8px 0 0">They’ll see your answers, so you won’t have to repeat yourself.</p>`}
  </div></main>`;
}

function closedScreen(){
  const s = S(), r = s.reply;
  return `<main class="screen" id="screen">${floatbar()}<div class="pad">
    <h2 class="hello">Care</h2>
    <div class="card"><div class="inbox"><span class="av">${r.av}</span><div><div class="who">${r.from} · ${r.role}</div><div class="when">Today, 9:40am · re: your check-in</div><p>${esc(r.text)}</p></div></div></div>
    <div class="card"><h3>Treatment tracker</h3><div class="tracker">${s.tracker.map(t => `<div><div class="k">${t[0]}</div><div class="v ${t[2] ? 'new' : ''}">${t[1]}</div></div>`).join('')}</div></div>
  </div></main>${tabbar('Care')}`;
}

/* ===================== Render + events ===================== */
function render(){
  const st = state.stage;
  const body = st === 'today' ? todayScreen() : st === 'lock' ? lockScreen() : st === 'chat' ? chatScreen() : st === 'plan' ? planScreen() : closedScreen();
  $('#app').innerHTML = body + (st === 'today' ? quickSheet() : '');
  const scr = $('#screen');
  if (st === 'chat' && scr){ if (matchMedia('(max-width:900px)').matches) window.scrollTo(0, document.body.scrollHeight); else scr.scrollTop = scr.scrollHeight; }
  renderTimeline(); renderCase();
  $('#sayPick').hidden = !S().quiet;
}
function setWeek(w){
  const s = S(); state.week = Math.max(1, Math.min(s.flag, w));
  state.stage = state.week >= s.flag ? 'lock' : 'today';
  if (state.week < s.flag) state.chat = null;
  render();
}
let timer = null;
function stopPlay(){ clearInterval(timer); timer = null; state.playing = false; }
function play(){
  const s = S();
  if (state.playing){ stopPlay(); render(); return; }
  if (state.week >= s.flag || state.stage !== 'today'){ state = initial(state.scenario, state.say); }
  state.playing = true; render();
  timer = setInterval(() => {
    if (state.week >= s.flag){ stopPlay(); render(); toast('Check-in sent to Sarah'); return; }
    setWeek(state.week + 1);
    if (state.week >= s.flag){ stopPlay(); render(); toast('Check-in sent to Sarah'); }
  }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 800);
}

document.addEventListener('input', e => { if (e.target.id === 'wk'){ stopPlay(); setWeek(+e.target.value); } });
document.addEventListener('change', e => {
  if (e.target.name === 'scenario'){ stopPlay(); state = initial(e.target.value, state.say); render(); }
  if (e.target.name === 'say'){ state.say = e.target.value; if (state.chat){ state.chat = newChat(); if (state.stage !== 'chat' && state.stage !== 'lock') state.stage = 'lock'; } render(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  switch (a){
    case 'play': play(); break;
    case 'skip-to': stopPlay(); state = initial(state.scenario, state.say); setWeek(S().flag); toast('Check-in sent to Sarah'); break;
    case 'open-chat': if (!state.chat) state.chat = newChat(); state.stage = 'chat'; render(); break;
    case 'back-lock': state.stage = 'lock'; render(); break;
    case 'back-chat': state.stage = 'chat'; render(); break;
    case 'chat': chatAnswer(v); break;
    case 'unhear': state.chat.heard.keys = state.chat.heard.keys.filter(k => k !== el.dataset.k); render(); break;
    case 'unhear-x': state.chat.heard.extra = state.chat.heard.extra.filter(x => x[0] !== el.dataset.k); render(); break;
    case 'heard-ok': heardOk(); break;
    case 'quick': stopPlay(); state.quick = {}; render(); break;
    case 'q-scrim': if (e.target !== el) break;
    case 'q-close': state.quick = null; render(); break;
    case 'q-x': state.quick.heard = state.quick.heard.filter(k => k !== el.dataset.k); render(); break;
    case 'q-ok': state.logged = Object.fromEntries(state.quick.heard.map(k => [k, true])); state.quick = null; render(); toast('Logged'); break;
    case 'to-plan': state.stage = 'plan'; render(); $('#screen').scrollTop = 0; break;
    case 'send': state.chat.sent = true; render(); toast('Sent. They’ll see everything.'); break;
    case 'skip': state.stage = 'closed'; render(); $('#screen').scrollTop = 0; break;
    case 'replay': stopPlay(); state = initial(state.scenario, state.say); render(); break;
    case 'reset': stopPlay(); state = initial(); document.querySelector('input[name=scenario][value=dose]').checked = true; document.querySelector('input[name=say][value=busy]').checked = true; render(); toast('Demo reset'); break;
    case 'todo': toast('Not part of this prototype'); break;
  }
});
/* Tap vs hold on the talk button. Tap = answer with buttons. Hold (or hold Space/Enter) = talk to June. */
const HOLD_MS = 350; let holdT = null, held = false;
function pressStart(){ held = false; clearTimeout(holdT); holdT = setTimeout(() => { held = true; startTalk(); }, HOLD_MS); }
function pressEnd(){
  const pending = holdT !== null; clearTimeout(holdT); holdT = null;
  if (held){ held = false; endTalk(); return; }
  if (!pending) return;
  if (state.quick){ toast('Hold the button, then talk'); return; }
  const c = state.chat; if (!c) return;
  if (c.step < 0) chatAnswer('go'); else toast('Tap an answer above, or hold to talk');
}
document.addEventListener('pointerdown', e => { if (e.target.closest('[data-talk]')){ e.preventDefault(); pressStart(); } });
document.addEventListener('pointerup', () => { if (holdT !== null || held) pressEnd(); });
document.addEventListener('pointercancel', () => { clearTimeout(holdT); holdT = null; if (held){ held = false; endTalk(); } });
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-talk]')) e.preventDefault(); });
document.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat && e.target.closest && e.target.closest('[data-talk]')){ e.preventDefault(); pressStart(); } });
document.addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'Enter') && (holdT !== null || held)){ e.preventDefault(); pressEnd(); } });
render();
</script>
</body>
</html>
